services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crusaderstrike
      POSTGRES_PASSWORD: crusaderstrike
      POSTGRES_DB: crusaderstrike
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crusaderstrike"]
      interval: 2s
      timeout: 5s
      retries: 20
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crusaderstrike:crusaderstrike@db:5432/crusaderstrike
      SESSION_SECRET: local-dev-session-secret-at-least-32-chars
      BLIZZARD_MOCK: "true"
      PUBLIC_WEB_ORIGIN: http://localhost:8080
      PUBLIC_API_ORIGIN: http://localhost:3000
      BLIZZARD_REDIRECT_URI: http://localhost:3000/api/v1/auth/blizzard/callback
      CORS_ORIGINS: http://localhost:8080
      PORT: "3000"
    ports:
      - "3000:3000"
