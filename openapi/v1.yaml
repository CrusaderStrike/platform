  /characters/{character_id}/gear-lists:
    get:
      tags: [gear]
      operationId: listCharacterGearLists
      summary: Gear wishlists for a character (max 20)
      description: |
        Lists are **per character** (platform#17). Returns at most 20 active lists.
        Owner sees private + guild-shared lists they own; other guild members only see
        lists with `visibility=guild` for characters they can access via guild context.
        Caller must own the character and have it in their display set; unknown character
        → **404**, owned but not displayed → **409** `character_not_displayed`.
      parameters:
        - name: character_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Active gear lists for the character.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/GearList' }
              example:
                items:
                  - id: 019a0000-0000-7000-8000-000000000001
                    character_id: "us-emberfall-aldric"
                    owner_user_id: 019a0000-0000-7000-8000-0000000000aa
                    name: Emberfall BiS
                    visibility: private
                    version: 3
                    updated_at: "2026-11-05T03:00:00Z"
                    updated_source: web
                    items:
                      - slot: main_hand
                        item_id: 19019
                        priority: 1
                        note: Thunderfury wish
                        obtained: false
                        obtained_at: null
                        icon_url: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [gear]
      operationId: createCharacterGearList
      summary: Create a named gear set / wishlist (emits GearListCreated + optional GearSlotSet)
      description: |
        Max **20** active lists per character. A 21st create returns **409** `list_limit_reached`.
        Default `visibility` is `private`. Emits `GearListCreated` (seq=1); optional create `slots`
        also emit `GearSlotSet` per non-null slot.
        Character must be owned and displayed → else **404** / **409** `character_not_displayed`
        (ownership is checked first).
        Slot/item validation on create `slots` uses **400** `validation_error` field details
        (`slot: invalid_slot`, `item_id: item_not_in_slot` / `item_not_forever`). Invalid slots
        are checked before the cap, so a 21st create with a bad slot returns **400** rather than
        **409** `list_limit_reached`.
        Level rules (`until_level_*`, `leveling_set_at_max_level`) apply on create and when
        PATCH changes `type` or `until_level`. A non-number `until_level` sent with
        `type: max_level` surfaces as `until_level_must_be_null`.
        Gear writes are rate-limited (~60 writes/min per user, fixed 60s window, no minimum interval); over limit → **429** with `Retry-After`. The limit is consumed **before** the write runs, so a later failure (for example 409 `version_mismatch`) still spends one token in the window.
      parameters:
        - name: character_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                type: { type: string, enum: [leveling, max_level] }
                until_level: { type: [integer, 'null'], minimum: 1, maximum: 60 }
                role_spec: { type: [string, 'null'], maxLength: 32 }
                visibility: { type: string, enum: [private, guild], default: private }
                slots:
                  type: object
                  additionalProperties: { type: [integer, 'null'] }
                  description: Optional map of GearSlot → item_id|null
            example: { name: Pre-BiS 50, type: leveling, until_level: 50, role_spec: fury, visibility: private }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { schema: { type: string }, description: '"v1"' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GearList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`list_limit_reached` (cap 20) or `character_not_displayed`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: list_limit_reached, message: Maximum of 20 gear lists per character., retryable: false, request_id: req_1, details: { limit: 20 } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /gear-lists/{list_id}:
    get:
      tags: [gear]
      operationId: getGearList
      summary: Gear list projection
      parameters:
        - { $ref: '#/components/parameters/ListId' }
      responses:
        '200':
          description: Gear list.
          headers:
            ETag: { schema: { type: string }, description: '"v<version>" concurrency token' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GearList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [gear]
      operationId: patchGearList
      summary: Rename and/or change visibility (If-Match required)
      description: |
        Strict optimistic concurrency for **list metadata**. Send `If-Match: "v<version>"`.
        Mismatch → **409** `version_mismatch` with `current: { version, list }` so the client
        can re-apply without another GET. Only the **owner** may write; officers get **403** `forbidden`.
        Emits `GearListRenamed` (name and/or visibility in payload).
        Missing If-Match → **428** `precondition_required`. Rate-limited (~60 writes/min per user, fixed 60s window, no minimum interval) → **429** with `Retry-After`. The limit is consumed **before** the write runs, so a later failure (for example 409 `version_mismatch`) still spends one token in the window.
      parameters:
        - { $ref: '#/components/parameters/ListId' }
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: If-Match
          in: header
          required: true
          schema: { type: string, examples: ['"v3"'] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                visibility: { type: string, enum: [private, guild] }
      responses:
        "428":
          description: Missing If-Match (precondition_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        '200':
          description: Updated.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GearList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: version_mismatch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GearVersionMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [gear]
      operationId: deleteGearList
      summary: Soft-delete list (If-Match required; emits GearListDeleted)
      parameters:
        - { $ref: '#/components/parameters/ListId' }
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      responses:
        "428":
          description: Missing If-Match (precondition_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: version_mismatch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GearVersionMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /gear-lists/{list_id}/slots/{slot}:
    put:
      tags: [gear]
      operationId: putGearListSlot
      summary: Set or clear one armory slot (optional If-Match; emits GearSlotSet or GearSlotCleared)
      description: |
        Body `{ item_id: number|null }` sets or clears one equipment slot on an armory set.
        CSRF + session + owner-only (non-owner → **404**). Character must be displayed → else
        **409** `character_not_displayed`.

        **If-Match is optional.** When present and mismatched → **409** `version_mismatch`.
        When omitted, last write wins. A no-op set/clear (slot already holds the requested
        `item_id`, or is already empty for `null`) returns **200** with the current state,
        ETag, and `version` **without** a new event or version bump.

        Slot/item validation uses **400** `validation_error` with field details:
        `{ slot: invalid_slot }`, `{ item_id: item_not_in_slot }`, `{ item_id: item_not_forever }`.
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: list_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: slot
          in: path
          required: true
          schema: { $ref: '#/components/schemas/GearSlot' }
        - name: If-Match
          in: header
          required: false
          schema: { type: string, example: '"v3"' }
          description: Optional optimistic concurrency. Omit for last-write-wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id]
              properties:
                item_id: { type: [integer, 'null'], minimum: 1 }
      responses:
        '200':
          description: Slot updated (or no-op current state)
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [slot, item_id, edited_at, version]
                properties:
                  slot: { $ref: '#/components/schemas/GearSlot' }
                  item_id: { type: [integer, 'null'] }
                  edited_at: { type: string, format: date-time }
                  version: { type: integer }
        '400':
          description: |
            validation_error with field details (`slot: invalid_slot`,
            `item_id: item_not_in_slot` / `item_not_forever`, bad `item_id` / If-Match).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrors' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: version_mismatch (when If-Match present) or character_not_displayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /gear-lists/{list_id}/ops:
    post:
      tags: [gear]
      operationId: applyGearOps
      summary: Append gear item ops (idempotent; item-level merge; always 200)
      description: |
        **Item edits never return 409.** Ops on different `(slot, item_id)` always merge.
        Same-item conflicts: last-writer-wins by server `recorded_at`; delete wins over
        reprioritize/obtain; a stale `base_version` loses. Losers are recorded as
        `GearOpRejected` and returned in `conflicts[]`.

        **Armory ops (platform#45):** `set_slot` replaces all items in a slot with one
        Forever `item_id` that fits the slot (priority 1) and emits `GearSlotSet`; no-op
        (no version bump; op_id still recorded for dedupe) when the slot already holds
        only that item. Wrong Forever slot → `item_not_in_slot`. `list_items_limit` applies
        only when `set_slot` introduces a row into an **empty** slot (replace never grows
        the list). `clear_slot` removes every item in the slot and emits `GearSlotCleared`;
        no-op when already empty. Wishlist ops (`add_item` / `remove_item` / …) stay valid
        for addon sync.

        **Same-request stale rule:** `base_version` is compared only against events that
        existed when the request started (`seq <= batchStartVersion`). Earlier ops in the
        same `/ops` or `/sync` batch do not make later ops stale, so Option A chunks that
        stamp one `base_version` (multi-item adds, remove+add swaps) all apply. Wishlist
        ops additionally treat only prior-request `GearSlotSet`/`GearSlotCleared` as a
        slot wipe watermark (`max(lastItemTouchSeq, lastSlotWipeSeq)`).

        **`base_version` (web):** the list `version` the client last observed (from GET,
        create, or the previous ops/sync response). Set every web op's `base_version` to
        that value. If the server has applied a later event touching the same item, the op
        loses with `stale_base_version` (or `item_removed`).

        **Undo obtained:** send `mark_obtained` with `obtained: false` (no separate op type).

        Unknown keys on individual ops are soft-ignored (listed in `ignored`). Envelope keys
        beyond `ops` are rejected (client `source` is ignored; server records `web`). Max 200 ops.
        Non-Forever `item_id` → the op is rejected; when a Forever catalog is enforced, clients
        should prefer **422** `item_not_forever` on single-item helpers — reserved code.
        Rate-limited (~60 writes/min per user, fixed 60s window, no minimum interval) → **429** with `Retry-After`. The limit is consumed **before** the write runs, so a later failure (for example 409 `version_mismatch`) still spends one token in the window.
      parameters:
        - { $ref: '#/components/parameters/ListId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              additionalProperties: false
              properties:
                # Client `source` is ignored; web session routes always record source=web.
                ops:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/GearOp' }
      responses:
        '200':
          description: Result (including partial conflicts).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GearOpsResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: item_not_forever (when Forever catalog is enforced)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /gear-lists/{list_id}/events:
    get:
      tags: [gear]
      operationId: listGearEvents
      summary: Gear list event history
      description: |
        Path is **`/events`** (not `/history`). Visibility follows the list: owner always;
        guild members when `visibility=guild`; others get **403** `forbidden`.
        `actor` is `{ user_id, display_name }` (BattleTag), not a bare UUID.
        Each `event_type` has a documented payload schema under `GearEventPayload*`.
      parameters:
        - { $ref: '#/components/parameters/ListId' }
        - name: after_version
          in: query
          schema: { type: integer, minimum: 0 }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Events ascending by version/seq.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GearEvent' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /items:
    get:
      tags: [gear]
      operationId: listItems
      summary: Search Forever item catalog by slot
      description: |
        Public Forever item catalog for the armory picker (platform#39 / #78). Data imported from
        Blizzard `static-forever-{region}` only — never classic/retail.
        `class` is a playable class (warrior|…|druid) and applies the full equip-rules engine
        (armor tier, weapon subclasses, off-hand / dual-wield, shields, relics, ammo, class-set
        ownership). `armor_type` remains an independent cloth|leather|mail|plate filter; both
        may be combined. Junk names (Monster, Test/(TEST), [PH], Deprecated, AHNQIRAJ TEST)
        are excluded by default. `/items/search` is an alias of this handler.
      parameters:
        - name: slot
          in: query
          schema: { $ref: '#/components/schemas/GearSlot' }
        - name: class
          in: query
          description: Playable class filter (applies full equip rules)
          schema: { $ref: '#/components/schemas/WowClass' }
        - name: armor_type
          in: query
          description: Armor type filter (independent of `class`)
          schema: { type: string, enum: [cloth, leather, mail, plate] }
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: min_item_level
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000 }
        - name: max_required_level
          in: query
          schema: { type: integer, minimum: 0, maximum: 60 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Matching Forever items
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ForeverItem' }
                  next_cursor: { type: [string, 'null'] }
        '304':
          description: Not modified (If-None-Match)
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /items/search:
    get:
      tags: [gear]
      operationId: searchItems
      summary: Alias of GET /items (Forever catalog)
      description: Same handler as `GET /api/v1/items` (platform#39 / #78).
      parameters:
        - name: slot
          in: query
          schema: { $ref: '#/components/schemas/GearSlot' }
        - name: class
          in: query
          description: Playable class filter (applies full equip rules)
          schema: { $ref: '#/components/schemas/WowClass' }
        - name: armor_type
          in: query
          description: Armor type filter (independent of `class`)
          schema: { type: string, enum: [cloth, leather, mail, plate] }
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: min_item_level
          in: query
          schema: { type: integer, minimum: 0 }
        - name: max_required_level
          in: query
          schema: { type: integer, minimum: 0, maximum: 60 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Matching Forever items
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ForeverItem' }
                  next_cursor: { type: [string, 'null'] }
        '304':
          description: Not modified
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /items/{item_id}:
    get:
      tags: [gear]
      operationId: getItem
      summary: Forever item by id
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Forever item
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForeverItem' }
        '304':
          description: Not modified
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sync/savedvariables:
    post:
      tags: [sync]
      operationId: manualSavedVariablesSync
      summary: Manual sync without a helper app (upload SavedVariables, download updated file)
      description: |
        Export-string / file path for platform#21. Same gear op schema and conflict rules as
        `POST /sync` with `source: export`. Not fully implemented in #17 (gear JSON sync is).
        Max body 2 MB.
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: text/plain, description: 'SavedVariables Lua file, max 2 MB.' }
      responses:
        '501':
          description: Reserved; use POST /sync with source=export for JSON ops in #17.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sync:
    post:
      tags: [sync]
      operationId: addonSync
      summary: Push gear ops and pull events (companion or export; same schema)
      description: |
        Sync path is **agnostic** (platform#21 still open): companion app and export/SavedVariables
        feeders both POST this shape. Set `source` to `companion`, `export`, or `addon` only.
        `web` and `system` are never accepted from clients (server-derived on session routes).
        Provide `characterId` **or** `realm`+`name` (realm normalized like `/uploads`).
        Envelope is strict; unknown keys on individual ops are soft-ignored.
        Each list entry applies `ops[]` under SAVEPOINTs with stable reject codes, then returns
        server events after `since_version` plus the new `version`.

        Conflict rules: auto-merge by slot/item; last-writer-wins by `recorded_at`; stale
        `base_version` loses; delete wins; losers → `GearOpRejected` in `conflicts[]`.
        Max body 1 MiB. Rate-limited (~60 writes/min per user, fixed 60s window, no minimum interval) → **429** with `Retry-After`. The limit is consumed **before** the write runs, so a later failure (for example 409 `version_mismatch`) still spends one token in the window.
        Per-list failures return a stable `error` object (no raw database messages).
        At most **500** ops total across all lists in one request.
      security: [{ uploaderToken: [] }, { session: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncRequest' }
            example:
              schemaVersion: 1
              source: companion
              characterId: us-emberfall-aldric
              lists:
                - list_id: 019a0000-0000-7000-8000-000000000001
                  since_version: 3
                  ops:
                    - op_id: 019a0000-0000-7000-8000-0000000000ff
                      type: add_item
                      slot: head
                      item_id: 12345
                      priority: 1
                      base_version: 3
                      source: companion
      responses:
        '200':
          description: Sync result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  x-error-codes:
    description: |
      Stable error codes for gear-lists, selection, and items (platform#51).
      Full table: docs/api-errors.md. `retryable` is always present on the Error envelope.
    unauthenticated: { http: 401, retryable: false }
    session_expired: { http: 401, retryable: false }
    csrf_failed: { http: 403, retryable: false }
    validation_error: { http: 400, retryable: false }
    not_found: { http: 404, retryable: false }
    forbidden: { http: 403, retryable: false }
    rate_limited: { http: 429, retryable: true }
    version_mismatch: { http: 409, retryable: true }
    character_not_displayed: { http: 409, retryable: false }
    list_limit_reached: { http: 409, retryable: false }
    precondition_required: { http: 428, retryable: false }
    upstream_unavailable: { http: 502, retryable: true }
    payload_too_large: { http: 413, retryable: false }
    unsupported_media_type: { http: 415, retryable: false }
    internal_error: { http: 500, retryable: true }
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: cs_session
      description: Session cookie set after Blizzard OAuth (platform#11). The companion uploader uses `uploaderToken`.
    uploaderToken:
      type: http
      scheme: bearer
      description: Per-user uploader token (placeholder, issued after OAuth).
  x-rate-headers:
    RateLimit-Limit: { schema: { type: integer } }
    RateLimit-Remaining: { schema: { type: integer } }
    RateLimit-Reset: { schema: { type: integer } }
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required on non-GET requests that use the `cs_session` cookie. Must equal `Session.csrf_token`. Not needed with a bearer `uploaderToken`. Mismatch returns 403 `csrf_failed`.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ListId:
      name: list_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    RetryAfter:
      description: Seconds until retry is allowed.
      schema: { type: integer }
  responses:
    ValidationError:
      description: |
        Validation failed. Field-level errors map (not the `Error` envelope). A body that is
        not valid JSON returns `errors.body: invalid_json` — a field-error value, not an
        `error.code` — plus an optional top-level human-readable `message` (platform#56).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrors' }
          examples:
            field_errors:
              value: { errors: { name: required } }
            invalid_json:
              summary: Malformed JSON request body
              value: { errors: { body: invalid_json }, message: Request body is not valid JSON. }
    UnsupportedMediaType:
      description: Body must be application/json.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected server error (code `internal_error`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Body exceeds the size limit for this endpoint.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamUnavailable:
      description: Battle.net API failed or timed out (code `upstream_unavailable`); retry later.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: |
        No session (`unauthenticated`) or expired/revoked session / invalid Blizzard token
        (`session_expired`). Both are HTTP 401; see docs/api-errors.md.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed for this role or guild, or `csrf_failed`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found in the active guild (RLS hides other guilds).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict (e.g. `run_immutable`, `run_payload_mismatch`, `slug_taken`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionRequired:
      description: If-Match required (428)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: precondition_required, message: If-Match required., request_id: req_1 }
    PreconditionFailed:
      description: Version mismatch; reload and retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              description: Stable machine code (platform#51). Do not rename existing codes.
              examples: [unauthenticated, session_expired, csrf_failed, rate_limited, not_found, version_mismatch, list_limit_reached, character_not_displayed, precondition_required, forbidden, payload_too_large, unsupported_media_type, upstream_unavailable, internal_error, validation_error]
            message: { type: string, description: Safe human-readable text; never stacks/upstream bodies/secrets. }
            retryable:
              type: boolean
              description: If true, a later retry may succeed (honor Retry-After when present).
            request_id: { type: string }
            details:
              type: object
              additionalProperties: true
              description: 'Optional non-sensitive structured details, e.g. `{ limit: 20 }` on `list_limit_reached` (platform#53).'
              properties:
                limit:
                  type: integer
                  minimum: 1
                  description: Present on `list_limit_reached` — the per-character cap that was hit (currently 20).
    ValidationErrors:
      type: object
      description: Field-level validation errors (`errors` map of field → message).
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties: { type: string }
          description: 'Field → error value (e.g. `required`, `invalid_slot`, or `body: invalid_json`).'
        message:
          type: string
          description: Optional safe human-readable summary (e.g. on `invalid_json`); clients should prefer it over raw field values when present.
    PageMeta:
      type: object
      required: [next_cursor]
      properties:
        next_cursor: { type: [string, 'null'] }
    Session:
      type: object
      required: [battletag, memberships, csrf_token]
      properties:
        battletag: { type: string }
        csrf_token: { type: string, description: Send as X-CSRF-Token on state-changing cookie requests. }
        active_guild_id: { type: [string, 'null'], format: uuid }
        memberships:
          type: array
          items:
            type: object
            properties:
              guild_id: { type: string, format: uuid }
              guild_name: { type: string }
              role: { $ref: '#/components/schemas/MemberRole' }
    MemberRole:
      type: string
      enum: [owner, officer, member, recruit, alumni]
    Faction:
      type: string
      enum: [alliance, horde]

    PublicGuildSummary:
      type: object
      required: [region, realm_slug, realm_name, guild_slug, name, faction, recruiting, open_roles, updated_at]
      properties:
        region: { type: string, enum: [us, eu, kr, tw] }
        realm_slug: { type: string }
        realm_name: { type: string }
        guild_slug: { type: string }
        name: { type: string, maxLength: 48 }
        faction: { type: string, enum: [alliance, horde] }
        recruiting: { type: boolean }
        open_roles:
          type: array
          items: { type: string, enum: [tank, healer, dps] }
          uniqueItems: true
        updated_at: { type: string, format: date-time }
    PublicGuild:
      allOf:
        - { $ref: '#/components/schemas/PublicGuildSummary' }
        - type: object
          required: [pitch, recruiting_needs, raid_schedule, raid_timezone, contact, member_count]
          properties:
            pitch: { type: string, maxLength: 500 }
            recruiting_needs:
              type: array
              maxItems: 40
              items:
                type: object
                required: [class, role, priority]
                properties:
                  class:
                    type: string
                    enum: [warrior, paladin, hunter, rogue, priest, shaman, mage, warlock, druid]
                  role: { type: string, enum: [tank, healer, dps] }
                  priority: { type: string, enum: [high, medium, low] }
            raid_schedule:
              type: array
              maxItems: 14
              items:
                type: object
                required: [day, start, end]
                properties:
                  day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
                  start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                  end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
            raid_timezone:
              type: [string, 'null']
              maxLength: 64
              description: >
                IANA time zone name (e.g. America/Los_Angeles). Required non-null on the
                officer write path before public_listed; null when unset. No UTC default.
            contact:
              type: object
              required: [type, value]
              properties:
                type: { type: string, enum: [discord, in_game, url] }
                value: { type: string, maxLength: 200 }
            member_count:
              type: [integer, 'null']
              minimum: 0
              description: >
                Officer-set public_member_count only. null when unset — never coalesced to 0
                and never derived from COUNT(guild_members).
            emblem_url: { type: [string, 'null'], format: uri }
    PublicGuildList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicGuildSummary' }
        next_cursor: { type: [string, 'null'] }
    PublicGuildSitemap:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [region, realm_slug, guild_slug, updated_at]
            properties:
              region: { type: string, enum: [us, eu, kr, tw] }
              realm_slug: { type: string }
              guild_slug: { type: string }
              updated_at: { type: string, format: date-time }
        next_cursor: { type: [string, 'null'] }
    GuildCreate:
      type: object
      required: [name, realm, region]
      properties:
        name: { type: string, maxLength: 48 }
        realm: { type: string, maxLength: 48 }
        region: { $ref: '#/components/schemas/Region' }
        faction: { $ref: '#/components/schemas/Faction' }
    GuildUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 48 }
        description: { type: string, maxLength: 2000 }
        recruiting: { type: boolean }
    Guild:
      type: object
      required: [id, slug, name, realm, region, version]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        realm: { type: string }
        region: { type: string }
        faction: { $ref: '#/components/schemas/Faction' }
        description: { type: string }
        recruiting: { type: boolean }
        game: { const: wow_forever, description: WoW Forever only. }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
    Member:
      type: object
      required: [id, character_name, realm, role]
      properties:
        id: { type: string, format: uuid }
        character_name: { type: string }
        realm: { type: string }
        class: { type: string }
        role: { $ref: '#/components/schemas/MemberRole' }
        is_main: { type: boolean }
    WowClass:
      type: string
      description: Uppercase class token as the addon emits it.
      enum: [WARRIOR, PALADIN, HUNTER, ROGUE, PRIEST, SHAMAN, MAGE, WARLOCK, DRUID]
    AddonRunId:
      type: string
      maxLength: 128
      pattern: '^[^|]+\\|[^|]+\\|[0-9]+\\|[0-9]+$'
      description: '`{realm}|{character}|{startTimeUnix}|{instanceMapID}`, e.g. `CrusaderStrike|Snipy|1730000000|36`.'
    PartyMember:
      type: object
      required: [name, class]
      properties:
        name: { type: string, maxLength: 48 }
        realm: { type: string, maxLength: 48 }
        class: { $ref: '#/components/schemas/WowClass' }
        level: { type: [integer, 'null'], minimum: 1, maximum: 60, description: Values outside 1–60 (e.g. addon -1) are clamped to null. }
        isPlayer: { type: boolean, description: True for the logging character. }
    BossKill:
      type: object
      required: [npcId, name, killedAt]
      properties:
        npcId: { type: integer }
        name: { type: string, maxLength: 64 }
        killedAt: { type: integer, description: Unix seconds. }
    Death:
      type: object
      required: [name, time]
      properties:
        name: { type: string, maxLength: 48 }
        realm: { type: string, maxLength: 48 }
        time: { type: integer, description: Unix seconds. }
        source: { type: [string, 'null'], maxLength: 64 }

    AddonUpload:
      type: object
      additionalProperties: false
      required: [schemaVersion]
      description: |
        Batch envelope (schemaVersion 1). Provide `characterId` **or** `realm` + `name`.
        At least one of dungeonRuns, worldPvp, battlegrounds must be non-empty.
        Caps match the addon: worldPvp ≤ 1000, battlegrounds ≤ 500, dungeonRuns ≤ 100.
        The 1 MiB body limit covers the whole request; clients split backlogs across requests.
        Envelope is strict; unknown keys on records/stats are soft-ignored.
      properties:
        schemaVersion: { type: integer, const: 1 }
        characterId: { type: string, maxLength: 128, description: Platform opaque character id from selection. }
        realm: { type: string, maxLength: 48, description: Alternative to characterId (with name). }
        name: { type: string, maxLength: 48, description: Character name; use with realm. }
        dungeonRuns:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/RunUploadStrict' }
        worldPvp:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/WorldPvpRecord' }
        battlegrounds:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/BattlegroundRecord' }
    RunUploadStrict:
      type: object
      description: |
        Dungeon-run record for /uploads. Known fields are validated; unknown keys (e.g. `synced`)
        are soft-ignored, listed in the response `ignored` array, and omitted from stored raw_payload.
      additionalProperties: true
      required: [schemaVersion, gameVersion, idempotencyKey, addonRunId, realm, character, instance, startedAt, completed, status, party, bosses, deaths]
      properties:
        schemaVersion: { type: integer, const: 1 }
        gameVersion: { const: forever }
        idempotencyKey: { $ref: '#/components/schemas/AddonRunId' }
        addonRunId: { $ref: '#/components/schemas/AddonRunId' }
        realm: { type: string, maxLength: 48 }
        character: { type: string, maxLength: 48 }
        instance:
          type: object
          required: [id, name]
          additionalProperties: true
          properties:
            id: { type: integer, description: instanceMapID }
            name: { type: string, maxLength: 64 }
            difficulty: { type: [integer, 'null'] }
            difficultyName: { type: [string, 'null'] }
        startedAt: { type: integer, description: Unix seconds., minimum: 0, maximum: 4102444800 }
        endedAt: { type: [integer, 'null'], minimum: 0, maximum: 4102444800 }
        durationSec: { type: [integer, 'null'], minimum: 0, maximum: 2000000 }
        completed: { type: boolean }
        status: { type: string, enum: [in_progress, closed, completed] }
        party: { type: array, minItems: 1, maxItems: 40, items: { $ref: '#/components/schemas/PartyMember' } }
        bosses: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/BossKill' } }
        deaths: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/Death' } }
    WorldPvpRecord:
      type: object
      additionalProperties: true
      required: [v, addon_pvp_id, time, result, honorable]
      description: |
        World PvP kill/death from addon#15 (pvp.world[]). Unknown keys such as `synced`
        are soft-ignored.
      properties:
        v: { type: integer, const: 1 }
        addon_pvp_id: { type: string, maxLength: 200 }
        time: { type: integer, description: Unix seconds (UTC). }
        zone: { type: [string, 'null'], maxLength: 64 }
        subzone: { type: [string, 'null'], maxLength: 64 }
        result: { type: string, enum: [kill, death] }
        honorable: { type: boolean }
        killer_source: { type: [string, 'null'], enum: [target, combat_log, null] }
        opponent:
          type: [object, 'null']
          additionalProperties: false
          properties:
            name: { type: [string, 'null'], maxLength: 48 }
            realm: { type: [string, 'null'], maxLength: 48 }
            class: { type: [string, 'null'], maxLength: 32 }
            level: { type: [integer, 'null'] }
            faction: { type: [string, 'null'], enum: [alliance, horde, null], description: Lowercase. }
    BattlegroundRecord:
      type: object
      additionalProperties: true
      required: [v, addon_pvp_id, mapId, mapName, startedAt, endedAt, durationSec, result]
      description: |
        Battleground match from addon#15 (pvp.battlegrounds[]). Stats store honorable_kills only;
        `killingBlows` and other unknown stats keys are soft-ignored.
      properties:
        v: { type: integer, const: 1 }
        addon_pvp_id: { type: string, maxLength: 200 }
        mapId: { type: integer }
        mapName: { type: string, maxLength: 64 }
        faction: { type: [string, 'null'], enum: [alliance, horde, null] }
        startedAt: { type: integer, description: Unix seconds (UTC)., minimum: 0, maximum: 4102444800 }
        endedAt: { type: integer, description: Unix seconds (UTC)., minimum: 0, maximum: 4102444800 }
        durationSec: { type: integer, minimum: 0, maximum: 2000000 }
        result: { type: string, enum: [win, loss, left, draw] }
        winner: { type: [integer, 'null'], enum: [0, 1, 255, null] }
        stats:
          type: object
          additionalProperties: true
          properties:
            honorableKills: { type: integer, minimum: 0 }
            deaths: { type: integer, minimum: 0 }
            honor: { type: integer, minimum: 0 }
    AddonUploadResult:
      type: object
      required: [accepted, duplicate, rejected, ignored, guild_id, character_id]
      properties:
        accepted: { type: integer }
        duplicate: { type: integer }
        rejected:
          type: array
          items:
            type: object
            required: [kind, id, reason]
            properties:
              kind: { type: string, enum: [dungeon_run, world_pvp, battleground] }
              id: { type: string }
              reason:
                type: string
                description: Stable codes such as character_mismatch, insert_failed (never raw DB text).
        ignored:
          type: array
          description: Soft-ignored unknown keys stripped from records/stats before storage.
          items:
            type: object
            required: [kind, id, keys]
            properties:
              kind: { type: string, enum: [dungeon_run, world_pvp, battleground, envelope] }
              id: { type: string }
              keys: { type: array, items: { type: string } }
        guild_id: { type: string, format: uuid }
        character_id: { type: string }
    RunUpload:
      type: object
      description: |
        The addon run JSON, schemaVersion 1, exactly as emitted (keys are camelCase and sorted by the addon encoder).
        Server mapping: addonRunId to addon_run_id, instance.id to dungeon_id, instance.name to dungeon,
        instance.difficultyName to difficulty, startedAt/endedAt (unix seconds) to started_at/completed_at,
        durationSec*1000 to duration_ms, completed to completed, party[] to participants, and the full JSON to raw_payload.
        Unknown extra keys are accepted and kept in raw_payload.
      required: [schemaVersion, gameVersion, idempotencyKey, addonRunId, realm, character, instance, startedAt, completed, status, party, bosses, deaths]
      properties:
        schemaVersion: { type: integer, minimum: 1, description: 'Server max is 1; above that returns 400.' }
        gameVersion: { const: forever }
        idempotencyKey: { $ref: '#/components/schemas/AddonRunId' }
        addonRunId: { $ref: '#/components/schemas/AddonRunId' }
        realm: { type: string, maxLength: 48 }
        character: { type: string, maxLength: 48 }
        instance:
          type: object
          required: [id, name]
          properties:
            id: { type: integer, description: instanceMapID }
            name: { type: string, maxLength: 64 }
            difficulty: { type: [integer, 'null'] }
            difficultyName: { type: [string, 'null'] }
        startedAt: { type: integer, description: Unix seconds. }
        endedAt: { type: [integer, 'null'] }
        durationSec: { type: [integer, 'null'], minimum: 0 }
        completed: { type: boolean, description: Final boss killed. }
        status: { type: string, enum: [in_progress, closed, completed] }
        party: { type: array, minItems: 1, maxItems: 40, items: { $ref: '#/components/schemas/PartyMember' } }
        bosses: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/BossKill' } }
        deaths: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/Death' } }
    RunImport:
      type: object
      required: [export]
      properties:
        export: { type: string, maxLength: 65536, description: '`CSRUN1:<base64(utf8 json)>`.' }
    RunCorrection:
      type: object
      required: [kind, reason]
      properties:
        kind: { type: string, enum: [correct, invalidate] }
        reason: { type: string, maxLength: 500 }
        changes:
          type: object
          properties:
            duration_ms: { type: integer }
            completed_at: { type: string, format: date-time }
            completed: { type: boolean }
    Participant:
      type: object
      required: [character_name, class]
      properties:
        character_name: { type: string }
        realm: { type: [string, 'null'] }
        class: { $ref: '#/components/schemas/WowClass' }
        level: { type: [integer, 'null'] }
        is_logger: { type: boolean }
        role: { type: [string, 'null'], enum: [tank, healer, dps, null], description: Not supplied by the addon; optional. }
        member_id: { type: [string, 'null'], format: uuid }
    Run:
      type: object
      description: Stored run (snake_case), stored with RLS on guild_id.
      required: [id, addon_run_id, schema_version, game_version, dungeon_id, dungeon, started_at, completed, participants, bosses, deaths]
      properties:
        id: { type: string, format: uuid }
        addon_run_id: { $ref: '#/components/schemas/AddonRunId' }
        schema_version: { type: integer }
        game_version: { const: forever }
        dungeon_id: { type: integer }
        dungeon: { type: string }
        difficulty: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        duration_ms: { type: [integer, 'null'] }
        completed: { type: boolean }
        status: { type: string, enum: [in_progress, closed, completed] }
        participants: { type: array, items: { $ref: '#/components/schemas/Participant' } }
        bosses: { type: array, items: { $ref: '#/components/schemas/BossKill' } }
        deaths: { type: array, items: { $ref: '#/components/schemas/Death' } }
        raw_payload: { type: object, description: Latest accepted addon JSON verbatim. }
        invalidated: { type: boolean }
        updated: { type: boolean, description: True when this request upgraded an unfinished run. }
        uploaded_by: { type: string }
        recorded_at: { type: string, format: date-time }
        corrections: { type: array, items: { $ref: '#/components/schemas/RunCorrection' } }
    Region:
      type: string
      enum: [us, eu, kr, tw]
    Character:
      type: object
      description: WoW Forever character from Battle.net profile namespace `profile-forever-{region}`.
      required: [id, character_name, game]
      properties:
        id: { type: string, description: Stable opaque id. }
        character_name: { type: string }
        surname: { type: [string, 'null'] }
        realm: { type: [string, 'null'] }
        region: { $ref: '#/components/schemas/Region' }
        faction: { type: [string, 'null'], enum: [alliance, horde, null], description: 'Optional. Lowercase API values; Blizzard ALLIANCE/HORDE map here. Null when unknown.' }
        class: { type: string }
        race: { type: string }
        level: { type: integer }
        game: { const: wow_forever }
        stale:
          type: boolean
          description: True when the character was missing from the latest Battle.net refresh. Never hard-deleted.
        displayed:
          type: boolean
          description: True when the character is in the user's profile display set. Defaults to false for new characters.
    CharacterSelectionInput:
      oneOf:
        - type: object
          required: [displayed_character_ids]
          additionalProperties: false
          properties:
            displayed_character_ids:
              type: array
              uniqueItems: true
              maxItems: 50
              items: { type: string }
              description: Full replace of the display set. Empty array clears it.
        - type: object
          description: Legacy body accepted for one release (live web until web#43). Mapped to displayed_character_ids as [main_id, ...alt_ids].
          properties:
            main_id:
              oneOf:
                - { type: string }
                - { type: 'null' }
            alt_ids:
              type: array
              items: { type: string }
          additionalProperties: false
    CharacterSelection:
      type: object
      required: [displayed_character_ids, main_id, alt_ids, updated_at]
      properties:
        displayed_character_ids:
          type: array
          items: { type: string }
        main_id:
          oneOf:
            - { type: string }
            - { type: 'null' }
          description: Compat — first displayed id (or null). Remove after web#43.
        alt_ids:
          type: array
          items: { type: string }
          description: Compat — remaining displayed ids. Remove after web#43.
        updated_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
          description: From character_selections.updated_at; null when the display set is empty.
    CharacterList:
      type: object
      required: [game, characters, selection]
      properties:
        game: { const: wow_forever }
        characters: { type: array, items: { $ref: '#/components/schemas/Character' } }
        selection: { $ref: '#/components/schemas/CharacterSelection' }

    UserProfile:
      type: object
      required: [battletag, preferred_region, main_character_id, created_at, updated_at]
      properties:
        battletag: { type: string }
        preferred_region: { $ref: '#/components/schemas/Region' }
        main_character_id:
          oneOf:
            - { type: string }
            - { type: 'null' }
          description: Compat — first displayed character id (or null). Remove after web#43.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserProfileUpdate:
      type: object
      minProperties: 0
      additionalProperties: false
      properties:
        preferred_region: { $ref: '#/components/schemas/Region' }
    EquippedItem:
      type: object
      description: |
        One equipped item on a character. Uses camelCase `itemId` to match the Web Dev mock;
        wishlist `GearItem` keeps snake_case `item_id` (platform#17).
      required: [slot, itemId]
      properties:
        slot: { $ref: '#/components/schemas/GearSlot' }
        itemId: { type: integer, minimum: 1 }
        name: { type: [string, 'null'], maxLength: 128 }
        quality:
          type: [string, 'null']
          enum: [poor, common, uncommon, rare, epic, legendary, null]
        ilvl: { type: [integer, 'null'], minimum: 1 }
        icon: { type: [string, 'null'], maxLength: 128, description: "Blizzard icon asset name without file extension (compat)." }
        icon_url:
          type: [string, 'null']
          format: uri
          description: |
            Full HTTPS URL from Blizzard Item Media when Forever static namespace is officially
            documented. Currently always null: Blizzard has not published an official Forever
            static namespace pairing with `profile-forever-{region}` (community probes suggest
            `static-forever-{region}`, unconfirmed — do not guess). When enabled, platform will
            call `GET /data/wow/media/item/{itemId}` and cache `assets[key=icon].value`, accepting
            only `https` URLs whose host is exactly `render.worldofwarcraft.com`. Clients must not
            build `render.worldofwarcraft.com` URLs themselves. Classic namespaces are never used.
    CharacterGearInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 19
          items: { $ref: '#/components/schemas/EquippedItem' }
    CharacterGear:
      allOf:
        - { $ref: '#/components/schemas/CharacterGearInput' }
        - type: object
          required: [character_id, updated_at]
          properties:
            character_id: { type: string }
            updated_at: { type: string, format: date-time }

    RankingEntry:
      type: object
      properties:
        rank: { type: integer }
        character_name: { type: string }
        member_id: { type: [string, 'null'], format: uuid }
        value: { type: number }
        run_id: { type: [string, 'null'], format: uuid }
    ForeverItem:
      type: object
      required: [item_id, name, slot, inventory_type, quality, item_level, required_level, armor_type, item_class, item_subclass, allowed_classes, stats, icon_url, source, verified]
      properties:
        item_id: { type: integer, minimum: 1 }
        name: { type: string }
        slot: { $ref: '#/components/schemas/GearSlot' }
        inventory_type: { type: string, description: Blizzard inventory_type.type }
        quality: { type: string }
        item_level: { type: integer }
        required_level: { type: integer }
        armor_type: { type: [string, 'null'], enum: [cloth, leather, mail, plate, null] }
        item_class: { type: [integer, 'null'], description: Blizzard item_class.id }
        item_subclass: { type: [integer, 'null'], description: Blizzard item_subclass.id }
        allowed_classes:
          type: [array, 'null']
          description: Effective class restriction (item's own playable_classes, else its set's). Null means unrestricted.
          items: { $ref: '#/components/schemas/WowClass' }
        stats:
          type: [array, 'null']
          items:
            type: object
            required: [type, value]
            properties:
              type: { type: string }
              value: { type: number }
        icon_url:
          type: [string, 'null']
          description: HTTPS render.worldofwarcraft.com URL or null
        source: { type: string, enum: [blizzard_forever] }
        verified: { type: boolean, enum: [true] }

    GearSlot:
      type: string
      description: WoW Forever equipment slots (shared by web and addon).
      enum: [head, neck, shoulder, back, chest, shirt, tabard, wrist, hands, waist, legs, feet, finger1, finger2, trinket1, trinket2, main_hand, off_hand, ranged, ammo]
    GearItem:
      type: object
      description: |
        Wishlist item. Uses **snake_case** `item_id` (equipped gear keeps camelCase `itemId`).
        `icon_url` on wishlist projections may still be null; Forever item icons live on
        `ForeverItem.icon_url` from `GET /items` (Item Media via `static-forever-{region}`).
      required: [slot, item_id, priority, obtained]
      properties:
        slot: { $ref: '#/components/schemas/GearSlot' }
        item_id: { type: integer, minimum: 1 }
        priority: { type: integer, minimum: 1, maximum: 50 }
        note: { type: [string, 'null'], maxLength: 200 }
        obtained: { type: boolean }
        obtained_at: { type: [string, 'null'], format: date-time }
        obtained_run_id: { type: [string, 'null'], format: uuid }
        icon_url:
          type: [string, 'null']
          description: Optional HTTPS render.worldofwarcraft.com URL when resolved; often null on wishlist rows.
    GearList:
      type: object
      required: [id, character_id, owner_user_id, name, visibility, type, until_level, role_spec, outgrown, edited_at, slots, version, updated_at, items]
      properties:
        id: { type: string, format: uuid }
        character_id: { type: string }
        owner_user_id: { type: string, format: uuid }
        name: { type: string }
        visibility: { type: string, enum: [private, guild] }
        type: { type: string, enum: [leveling, max_level] }
        until_level: { type: [integer, 'null'], minimum: 1, maximum: 60 }
        role_spec: { type: [string, 'null'], maxLength: 32 }
        outgrown: { type: boolean, description: 'true when leveling and character.level >= until_level' }
        edited_at: { type: string, format: date-time, description: 'Same instant as updated_at / last event recorded_at' }
        slots:
          type: object
          description: Map of all 20 GearSlots → item_id or null
          additionalProperties: { type: [integer, 'null'] }
        version: { type: integer, description: 'Last applied event sequence; concurrency token for ETag vN.' }
        updated_at: { type: string, format: date-time }
        updated_source: { type: [string, 'null'], enum: [web, addon, companion, export, system, null] }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/GearItem' }
    GearOp:
      type: object
      required: [op_id, type, slot, base_version]
      additionalProperties: true  # unknown keys soft-ignored
      properties:
        op_id: { type: string, format: uuid, description: 'Idempotency key (guild_id, op:<op_id>).' }
        list_id: { type: string, format: uuid, description: 'Required in flat /sync ops; optional when nested under lists.' }
        type:
          type: string
          enum: [add_item, remove_item, reprioritize_item, mark_obtained, set_slot, clear_slot]
          description: |
            `set_slot` / `clear_slot` are armory replace-in-slot ops (platform#45).
            Old wishlist ops remain valid for addon sync.
            Soft-ignored on these two types: `priority`, `note`, `obtained`; also `item_id`
            on `clear_slot` (clear has no item). Unknown keys remain soft-ignored.
        slot: { $ref: '#/components/schemas/GearSlot' }
        item_id:
          type: integer
          minimum: 1
          description: Required for add/remove/reprioritize/mark_obtained/set_slot; omit for clear_slot.
        priority: { type: integer, minimum: 1, maximum: 50, description: 'Required for add_item and reprioritize_item.' }
        note: { type: string, maxLength: 200 }
        obtained: { type: boolean, description: 'Required for mark_obtained; false = undo.' }
        run_id: { type: [string, 'null'], format: uuid }
        base_version: { type: integer, minimum: 0, description: 'List version the client last observed.' }
        client_ts: { type: string, format: date-time }
        source: { type: string, enum: [web, addon, companion, export, system] }
    GearEventActor:
      type: object
      required: [user_id, display_name]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string, description: BattleTag }
    GearEvent:
      type: object
      required: [version, event_type, recorded_at, source]
      properties:
        version: { type: integer }
        event_type:
          type: string
          enum: [GearListCreated, GearListRenamed, GearListDeleted, GearListMetaChanged, GearItemAdded, GearItemRemoved, GearItemReprioritized, GearItemObtained, GearSlotSet, GearSlotCleared, GearOpRejected]
        payload:
          description: Per-type payload; see GearEventPayload*.
          oneOf:
            - { $ref: '#/components/schemas/GearEventPayloadCreated' }
            - { $ref: '#/components/schemas/GearEventPayloadRenamed' }
            - { $ref: '#/components/schemas/GearEventPayloadDeleted' }
            - { $ref: '#/components/schemas/GearEventPayloadItemAdded' }
            - { $ref: '#/components/schemas/GearEventPayloadItemRemoved' }
            - { $ref: '#/components/schemas/GearEventPayloadItemReprioritized' }
            - { $ref: '#/components/schemas/GearEventPayloadItemObtained' }
            - { $ref: '#/components/schemas/GearEventPayloadSlotSet' }
            - { $ref: '#/components/schemas/GearEventPayloadSlotCleared' }
            - { $ref: '#/components/schemas/GearEventPayloadRejected' }
        actor: { oneOf: [{ $ref: '#/components/schemas/GearEventActor' }, { type: 'null' }] }
        source: { type: string, enum: [web, addon, companion, export, system] }
        op_id: { type: [string, 'null'], format: uuid }
        recorded_at: { type: string, format: date-time }
    GearEventPayloadCreated:
      type: object
      required: [name, character_id]
      properties:
        name: { type: string }
        character_id: { type: string }
        visibility: { type: string, enum: [private, guild] }
    GearEventPayloadRenamed:
      type: object
      properties:
        name: { type: string }
        visibility: { type: string, enum: [private, guild] }
    GearEventPayloadDeleted:
      type: object
      additionalProperties: false
    GearEventPayloadItemAdded:
      type: object
      required: [slot, item_id, priority]
      properties:
        slot: { $ref: '#/components/schemas/GearSlot' }
        item_id: { type: integer }
        priority: { type: integer }
        note: { type: [string, 'null'] }
    GearEventPayloadItemRemoved:
      type: object
      required: [slot, item_id]
      properties:
        slot: { $ref: '#/components/schemas/GearSlot' }
        item_id: { type: integer }
    GearEventPayloadItemReprioritized:
      type: object
      required: [slot, item_id, priority]
      properties:
        slot: { $ref: '#/components/schemas/GearSlot' }
        item_id: { type: integer }
        priority: { type: integer }
        from_priority: { type: integer }
    GearEventPayloadItemObtained:
      type: object
      required: [slot, item_id, obtained]
      properties:
        slot: { $ref: '#/components/schemas/GearSlot' }
        item_id: { type: integer }
        obtained: { type: boolean, description: false = undo }
        run_id: { type: [string, 'null'], format: uuid }
    GearEventPayloadSlotSet:
      type: object
      required: [slot, item_id]
      properties:
        slot: { $ref: '#/components/schemas/GearSlot' }
        item_id: { type: integer }
      description: Emitted by set_slot (and create `slots`); replace-in-slot at priority 1.
    GearEventPayloadSlotCleared:
      type: object
      required: [slot]
      properties:
        slot: { $ref: '#/components/schemas/GearSlot' }
      description: Emitted by clear_slot; removes all items in the slot.
    GearEventPayloadRejected:
      type: object
      required: [op_id, reason]
      properties:
        op_id: { type: string, format: uuid }
        reason: { type: string }
        winning_seq: { type: integer }
        slot: { $ref: '#/components/schemas/GearSlot' }
        item_id: { type: integer }
        message: { type: string }
    GearConflict:
      type: object
      required: [op_id, reason]
      properties:
        op_id: { type: string, format: uuid }
        reason: { type: string, enum: [superseded_by_newer_edit, item_removed, stale_base_version, item_not_forever, item_not_in_slot, list_items_limit] }
        winning_version: { type: integer }
        message: { type: string }
    GearOpsResult:
      type: object
      required: [version, applied, duplicates, conflicts, list]
      properties:
        version: { type: integer }
        applied: { type: array, items: { type: string, format: uuid } }
        duplicates: { type: array, items: { type: string, format: uuid } }
        conflicts: { type: array, items: { $ref: '#/components/schemas/GearConflict' } }
        ignored:
          type: array
          items:
            type: object
            required: [op_id, keys]
            properties:
              op_id: { type: string, format: uuid }
              keys: { type: array, items: { type: string } }
        list: { $ref: '#/components/schemas/GearList' }
    GearVersionMismatch:
      type: object
      required: [error, current]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, const: version_mismatch }
            message: { type: string }
            request_id: { type: string }
        current:
          type: object
          required: [version, list]
          properties:
            version: { type: integer }
            list: { $ref: '#/components/schemas/GearList' }
    SyncRequest:
      type: object
      description: |
        Same payload for companion and export channels. Use `lists[]` or a flat `ops[]`
        (each op must carry `list_id`) with top-level `since_version`.
      required: [source]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer, const: 1 }
        source: { type: string, enum: [addon, companion, export] }
        characterId: { type: string }
        realm: { type: string }
        name: { type: string }
        since_version: { type: integer, minimum: 0, description: 'Used with flat ops array.' }
        ops:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/GearOp' }
        lists:
          type: array
          maxItems: 50
          items:
            type: object
            required: [list_id, since_version]
            properties:
              list_id: { type: string, format: uuid }
              since_version: { type: integer, minimum: 0 }
              ops: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/GearOp' } }
    SyncResponse:
      type: object
      required: [character_id, source, runs, gear]
      properties:
        character_id: { type: string }
        source: { type: string, enum: [web, addon, companion, export, system] }
        runs:
          type: array
          description: Reserved for combined run+gear sync; empty in #17 gear-only sync.
          items:
            type: object
            additionalProperties: true
        gear:
          type: array
          items:
            type: object
            properties:
              list_id: { type: string, format: uuid }
              result: { $ref: '#/components/schemas/GearOpsResult' }
              events: { type: array, items: { $ref: '#/components/schemas/GearEvent' } }
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  request_id: { type: string }
