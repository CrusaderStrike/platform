openapi: 3.1.0
info:
  title: CrusaderStrike Platform API
  version: 1.0.0-draft
  summary: World of Warcraft Forever only.
  description: |
    Language-agnostic v1 contract (platform#14). Supports **World of Warcraft Forever only**.

    **Tenancy:** guild-scoped endpoints derive `guild_id` from the authenticated session's
    active guild membership. Any guild_id in a request body is ignored. The server runs every
    request in a transaction with `SET LOCAL app.guild_id`, and Postgres RLS enforces isolation.

    **Gear lists** are event-sourced. The op log is the source of truth and the list view is a projection
    updated in the same transaction (platform#13). Ops merge at item level, and losing ops are
    reported as conflicts.

    **CORS:** origins `https://crusaderstrike.com` and `https://www.crusaderstrike.com`. Credentialed requests
    get `Access-Control-Allow-Credentials: true`, with methods `GET, POST, PUT, PATCH, DELETE, OPTIONS` and
    headers `Content-Type, X-CSRF-Token, If-Match, If-None-Match, Authorization`. Exposed response headers
    include `Retry-After`, `ETag`, `RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset`.

    **CSRF:** `GET /auth/session` returns `csrf_token`, which is bound to the session. Every state-changing
    (non-GET) request authenticated with the `cs_session` cookie must send it as `X-CSRF-Token`, or it gets
    `403` with code `csrf_failed`. Requests with a bearer `uploaderToken` are exempt.

    **Body size:** JSON bodies are capped at 64 KB, except `/uploads` and `/sync` (1 MiB, whole body; clients split backlogs across requests) and `/sync/savedvariables` (2 MB).
    Larger bodies get `413`.

    **Rate limits:** every response carries `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`.
    A 429 response includes `Retry-After`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.crusaderstrike.com/api/v1
security:
  - session: []
tags:
  - name: auth
    description: Blizzard OAuth, session, profile and character selection (platform#11).
  - name: guilds
    description: Guild profile.
  - name: public
    description: Anonymous public reads (no session).
  - name: uploads
    description: Batch addon dungeon-run and PvP uploads (platform#3).
  - name: runs
    description: Addon run uploads and reads.
  - name: gear
    description: Event-sourced gear wishlists (platform#17) and per-character equipped gear (slice 1).
  - name: sync
    description: Addon companion sync (web to addon).
  - name: profile
    description: Signed-in user profile and character roster (platform#11).
paths:
  /auth/blizzard/login:
    get:
      tags: [auth]
      operationId: blizzardLogin
      summary: Start Blizzard OAuth (platform#11, return_to platform#64, prompt platform#76)
      description: |
        Redirects to Battle.net authorize with server-side state and PKCE. Scope `wow.profile`.
        The client secret never reaches the browser.
        Optional `prompt=login` is forwarded to Battle.net for a "switch account" flow after sign-out
        (platform#76). Blizzard's docs do not document `prompt`; community reports (2020) say it may
        be ignored when a Battle.net session already exists. We still forward allow-listed values.
      security: []
      parameters:
        - name: return_to
          in: query
          description: |
            Optional post-login path (platform#64, hardening #68). Same-origin relative path only: must start
            with a single `/` after decoding once; no `//`, scheme/host, backslash, or encoded versions of those.
            Also rejected after URL resolution if the path would leave the site origin (e.g. `/.//evil`).
            Scheme-looking segments after the leading slash are rejected, including `/foo:bar`.
            Validated with a shared helper and stored server-side with the OAuth state — the callback never
            reads `return_to` from the query and re-runs the same helper on the stored value.
            Invalid or missing values soft-fall back to `/profile/` (login still redirects to Battle.net; no 400).
            Accepted examples: `/profile/`, `/gear/`, `/@evil.com` (path on our origin).
          schema: { type: string, pattern: '^/(?![/\\])[^\\]*$', maxLength: 512 }
        - name: prompt
          in: query
          description: |
            Optional OIDC-style prompt forwarded to Battle.net authorize (platform#76).
            Allow-list: `login` only (`select_account` is not supported — Blizzard does not document it).
            Missing/empty → omit from the authorize URL. Any other value → `400` with
            `{ errors: { prompt: invalid } }` (unlike `return_to`, which soft-falls back).
            Intended for Web's switch-account flow: `DELETE /auth/session` then redirect here with
            `prompt=login` (and usually `return_to=/profile/`).
          schema: { type: string, enum: [login] }
      responses:
        '302':
          description: Redirect to Battle.net authorize URL. Invalid return_to falls back to /profile/.
        '400':
          description: Invalid `prompt` (not in allow-list).
  /auth/blizzard/callback:
    get:
      tags: [auth]
      operationId: blizzardCallback
      summary: OAuth callback; always redirects back to the site
      description: |
        This endpoint never returns JSON to the browser. It always responds with `302` to
        `https://crusaderstrike.com{stored_return_to}` plus an `auth` query parameter.
        `stored_return_to` comes from the server-side OAuth state row created at login (never from a
        callback query `return_to`). After lookup the state row is deleted (single-use). Missing,
        expired, or invalid stored paths fall back to `/profile/`.
        - `auth=ok` when the session is set (`Set-Cookie: cs_session; HttpOnly; Secure; SameSite=Lax`).
        - `auth=cancelled` when Battle.net sent `error=access_denied` (the user cancelled; there is no `code`).
        - `auth=error&reason=<code>` for any other failure. `reason` is one of `invalid_state`,
          `upstream_unavailable` (Battle.net token or profile call failed), `oauth_error` or `internal_error`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, description: 'Set by Battle.net on cancel/failure, e.g. access_denied.', schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirect to the site with `auth=ok|cancelled|error`.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string } }
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session, memberships and active guild
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [auth]
      operationId: logout
      summary: Log out
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/session/active-guild:
    put:
      tags: [auth]
      operationId: setActiveGuild
      summary: Switch active guild (must be a membership of the session)
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guild_id]
              properties:
                guild_id: { type: string, format: uuid }
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/characters:
    get:
      tags: [auth]
      operationId: listMyCharacters
      summary: The signed-in user's WoW Forever characters and display set
      description: |
        Fetched from the Battle.net profile API using the **WoW Forever** profile namespace
        `profile-forever-{region}` (for example `profile-forever-us`). Characters from any other game version are never
        returned. `surname` and `realm` are optional because the Forever profile may omit them.
      responses:
        '200':
          description: Character list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /me/characters/{character_id}:
    patch:
      tags: [auth]
      operationId: patchMyCharacter
      summary: Toggle whether a character is displayed on the profile (primary)
      description: |
        Primary UI path for the display set. Body `{ displayed: boolean }`. CSRF + session + owner-only.
        New characters default to `displayed: false`. Hiding a character keeps its gear sets; character-scoped
        list/create while hidden returns **409** `character_not_displayed`.
        Rate-limited with the gear write bucket. Does not bump `characters.updated_at`.
      parameters:
        - name: character_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayed]
              additionalProperties: false
              properties:
                displayed: { type: boolean }
      responses:
        '200':
          description: Updated character and current selection.
          content:
            application/json:
              schema:
                type: object
                required: [character, selection]
                properties:
                  character: { $ref: '#/components/schemas/Character' }
                  selection: { $ref: '#/components/schemas/CharacterSelection' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/characters/selection:
    put:
      tags: [auth]
      operationId: setMyCharacterSelection
      summary: Replace display set (optional bulk)
      description: |
        Optional full replace of displayed characters. Preferred body `{ displayed_character_ids: string[] }`
        (empty array clears the set). Also accepts legacy `{ main_id, alt_ids }` for one release
        (mapped to the display set). Every id must be an owned non-stale WoW Forever character;
        unknown / not-owned / non-Forever → **400** `validation_error` with
        `displayed_character_ids: unknown_character` (or `main_id` for legacy). Prefer
        `PATCH /me/characters/{id}` for single toggles. CSRF + session.
        Response always includes compat `main_id` / `alt_ids` derived from the display set.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterSelectionInput' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [selection]
                properties:
                  selection: { $ref: '#/components/schemas/CharacterSelection' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }

  /me/profile:
    get:
      tags: [profile]
      operationId: getMyProfile
      summary: Signed-in user profile
      description: |
        Returns the Battle.net profile for the session: battletag, preferred region,
        `main_character_id` (compat — first displayed character or null), and timestamps.
        Character roster and display set live on `GET /me/characters`.
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [profile]
      operationId: updateMyProfile
      summary: Update profile fields (not character selection)
      description: |
        Partial update of non-character profile fields. Character display set stays on
        `PATCH /me/characters/{id}` or `PUT /me/characters/selection`. Empty body is a no-op
        that returns the current profile.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileUpdate' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/characters/refresh:
    post:
      tags: [profile]
      operationId: refreshMyCharacters
      summary: Re-pull WoW Forever characters from Battle.net
      description: |
        CSRF-protected. Re-fetches the Battle.net profile with namespace `profile-forever-{region}`
        using the stored user token, upserts Forever characters, and marks missing ones stale
        (never hard-deletes). Stale characters are cleared from the display set (`displayed=false`).
        New characters default to `displayed: false`. Returns **200** with the same body as
        `GET /me/characters`. Blizzard failures return **502** `upstream_unavailable`.
        At most one successful or attempted refresh per user per **60 seconds**; a faster call
        returns **429** with `Retry-After` (seconds until the window opens).
        Display set: `PATCH /me/characters/{id}` (primary) or `PUT /me/characters/selection`.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Refreshed character list (same shape as GET /me/characters).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: |
            Refresh called within the 60-second window. `Retry-After` is seconds until another
            refresh is allowed. Body uses the shared `Error` shape (`rate_limited`).
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /characters/{character_id}/gear:
    get:
      tags: [gear]
      operationId: getCharacterGear
      summary: Equipped gear for a character (owner-only for now)
      description: |
        Per-character **equipped** gear (what the character is wearing), distinct from event-sourced
        gear *wishlists* under `/gear-lists` (platform#17). **Slice 1 / until platform#2 memberships:**
        owner-only. Non-owners (and unknown ids) get **404** so existence is not leaked. Guild-visible
        reads land after #2. Empty slots are omitted. Item objects use **camelCase** `itemId`
        (Web Dev mock contract).
      parameters:
        - name: character_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Equipped gear.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterGear' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [gear]
      operationId: putCharacterGear
      summary: Replace equipped gear (owner-only, CSRF-protected, full replace)
      description: |
        Owner-only. Full replace of the equipped set. At most one item per slot. Unknown slots or
        duplicate slots return 400. Non-owners get **404** (same as GET) until guild visibility in #2;
        widen to 403 for known non-owners after memberships land. Wishlist edits stay on `/gear-lists`.
        Body items use camelCase `itemId`.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: character_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterGearInput' }
      responses:
        '200':
          description: Saved equipped gear.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterGear' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/guilds:
    get:
      tags: [public]
      operationId: listPublicGuilds
      summary: Browse public Forever guilds (platform#37)
      security: []
      parameters:
        - name: region
          in: query
          description: Forever region filter (repeatable; OR). Lowercase us|eu|kr|tw.
          schema: { type: string, enum: [us, eu, kr, tw] }
          style: form
          explode: true
        - name: realm
          in: query
          schema: { type: string, maxLength: 48 }
          description: Forever realm slug (kebab-case allowlist for selected region).
        - name: faction
          in: query
          schema: { type: string, enum: [alliance, horde] }
        - name: role
          in: query
          schema: { type: string, enum: [tank, healer, dps] }
        - name: class
          in: query
          schema:
            type: string
            enum: [warrior, paladin, hunter, rogue, priest, shaman, mage, warlock, druid]
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Page of public guild summaries.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
            RateLimit-Limit: { schema: { type: string } }
            RateLimit-Remaining: { schema: { type: string } }
            RateLimit-Reset: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicGuildList' }
        '304': { description: Not modified. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /public/guilds/sitemap:
    get:
      tags: [public]
      operationId: listPublicGuildSitemap
      summary: Cursor-paginated public guild sitemap (platform#37)
      security: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Sitemap page.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicGuildSitemap' }
        '304': { description: Not modified. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /public/guilds/{region}/{realm_slug}/{guild_slug}:
    get:
      tags: [public]
      operationId: getPublicGuild
      summary: Public guild detail (platform#37)
      security: []
      parameters:
        - name: region
          in: path
          required: true
          schema: { type: string, enum: [us, eu, kr, tw] }
          description: Forever region (lowercase). Invalid values → 404.
        - name: realm_slug
          in: path
          required: true
          schema: { type: string, maxLength: 48 }
        - name: guild_slug
          in: path
          required: true
          schema: { type: string, maxLength: 48 }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Public guild.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicGuild' }
        '304': { description: Not modified. }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /guild:
    get:
      tags: [guilds]
      operationId: getGuild
      summary: Active guild profile
      responses:
        '200':
          description: Guild.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guild' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [guilds]
      operationId: updateGuild
      summary: Update guild profile (officer+; optimistic lock)
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: If-Match
          in: header
          required: true
          description: ETag (version) from GET.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuildUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guild' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /guilds:
    post:
      tags: [guilds]
      operationId: createGuild
      summary: Create guild (caller becomes owner)
      description: Exposes the open question from data-model.md (guild creation is currently admin-only).
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuildCreate' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guild' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /guild/members:
    get:
      tags: [guilds]
      operationId: listMembers
      summary: Guild roster
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of members.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageMeta' }
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Member' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /uploads:
    post:
      tags: [uploads]
      operationId: uploadAddonData
      security: [{ session: [] }]
      summary: Batch-upload dungeon runs and PvP records from the addon
      description: |
        Authenticated session upload for CrusaderStrike/addon export data (docs/run-schema.md,
        docs/pvp-schema.md from addon#15). Provide `characterId` (selected main/alt) **or**
        `realm` + `name`. Records are idempotent on `(character_id, addon_run_id|addon_pvp_id)`
        (guild is not part of the dedupe key). **`guild_id` rule:** on every re-upload the stored
        `guild_id` is updated to the caller's current upload guild for dungeon runs, world PvP,
        and battlegrounds alike. Realm compare normalizes both sides (strip spaces, hyphens,
        apostrophes; case-insensitive) so addon `GetNormalizedRealmName()` matches stored names.
        Still-`in_progress` re-uploads refresh bosses/deaths/payload; status only moves forward
        (`in_progress` → `closed` → `completed`). Each record is wrapped in a SAVEPOINT so one
        insert failure rejects that record without aborting later ones. Unknown envelope keys →
        400; unknown keys on individual records/stats are soft-ignored (stripped), listed in
        `ignored`, and omitted from stored `raw_payload`. Unknown `schemaVersion` → 400.
        **Body size:** the 1 MiB limit covers the whole JSON body. Clients must split large
        backlogs across multiple requests (respecting array caps and the 5s cooldown).
        Battleground `stats` stores `honorable_kills` only (`killingBlows` is ignored).
        Response counts `accepted`, `duplicate`, `rejected` (stable reason codes), and `ignored`.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddonUpload' }
      responses:
        '200':
          description: Ingest summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddonUploadResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /runs:
    post:
      tags: [runs]
      operationId: uploadRun
      deprecated: true
      security: [{ session: [] }, { uploaderToken: [] }]
      summary: Upload a run as the addon's JSON payload (schemaVersion 1)
      description: |
        **Deprecated.** Prefer `POST /uploads` for batch ingest. Kept for the website paste /
        CSRUN1 import path until that flow moves to `/uploads`.

        The body is exactly the addon's run JSON (CrusaderStrike/addon `docs/run-schema.md`, camelCase).
        The server stores the full JSON as `raw_payload`, and the `Run` response uses snake_case stored fields.
        **Idempotency and upgrade rules** on `(guild_id, addon_run_id)`, where `addon_run_id = addonRunId`:
        - No stored run: insert and return **201**.
        - Stored run has `completed=false` and the new payload is a superset (same `instance.id` and `startedAt`,
          with `bosses`/`deaths` containing the stored ones, and `endedAt`/`completed` only moving forward):
          replace it, keep the `run_id`, store the new `raw_payload`, and return **200** with `updated: true`.
        - The payload equals the stored one, or is a subset of it (an older export of the same run): return **200** with `updated: false`.
        - Stored run has `completed=true` and the payload differs: return **409** `run_immutable`. Completed runs change
          only through `POST /runs/{run_id}/corrections`.
        - Stored run is unfinished but the payload is not a superset (for example a different `instance.id` or `startedAt`):
          return **409** `run_payload_mismatch`.

        Validation: `schemaVersion` above the server maximum (currently 1) returns **400** with
        `errors.schemaVersion = "unsupported"`. `gameVersion` must be `forever`. Max body 64 KB (413).
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunUpload' }
      responses:
        '201':
          description: New run created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '200':
          description: |
            Existing run. `updated: true` means an unfinished run was upgraded. `updated: false` means an identical
            or older retry, and the stored run is returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [runs]
      operationId: listRuns
      summary: Run history (newest first)
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: dungeon_id, in: query, description: instanceMapID, schema: { type: integer } }
        - { name: character, in: query, schema: { type: string } }
        - { name: completed, in: query, schema: { type: boolean } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Page of runs.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageMeta' }
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Run' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /runs/import:
    post:
      tags: [runs]
      operationId: importRunExport
      security: [{ session: [] }, { uploaderToken: [] }]
      summary: Import the addon's `CSRUN1:` export string (website paste box / companion)
      description: |
        The server decodes the string: it strips all whitespace, requires the `CSRUN1:` prefix, base64-decodes the rest
        to UTF-8, parses it as JSON and validates it against `RunUpload`. It then ingests it exactly like `POST /runs`.
        A bad prefix, bad base64 or bad JSON returns **400** with `errors.export` set to `bad_prefix`, `bad_base64` or `bad_json`.
        The body can be JSON `{"export": "..."}` or the raw string as `text/plain`.
        **Idempotency and upgrade rules** on `(guild_id, addon_run_id)`, where `addon_run_id = addonRunId`:
        - No stored run: insert and return **201**.
        - Stored run has `completed=false` and the new payload is a superset (same `instance.id` and `startedAt`,
          with `bosses`/`deaths` containing the stored ones, and `endedAt`/`completed` only moving forward):
          replace it, keep the `run_id`, store the new `raw_payload`, and return **200** with `updated: true`.
        - The payload equals the stored one, or is a subset of it (an older export of the same run): return **200** with `updated: false`.
        - Stored run has `completed=true` and the payload differs: return **409** `run_immutable`. Completed runs change
          only through `POST /runs/{run_id}/corrections`.
        - Stored run is unfinished but the payload is not a superset (for example a different `instance.id` or `startedAt`):
          return **409** `run_payload_mismatch`.

        Validation: `schemaVersion` above the server maximum (currently 1) returns **400** with
        `errors.schemaVersion = "unsupported"`. `gameVersion` must be `forever`. Max body 64 KB (413).
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunImport' }
          text/plain:
            schema: { type: string, pattern: '^\\s*CSRUN1:', maxLength: 65536 }
      responses:
        '201':
          description: New run created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '200':
          description: |
            Existing run. `updated: true` means an unfinished run was upgraded. `updated: false` means an identical
            or older retry, and the stored run is returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /runs/{run_id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: One run with participants and corrections
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: Run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{run_id}/corrections:
    post:
      tags: [runs]
      operationId: correctRun
      summary: Append a correction or invalidation (officer+; who may correct is an open question for Drew)
      description: This is the only way to change a completed run. The original `raw_payload` is kept.
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunCorrection' }
      responses:
        '201':
          description: Correction appended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rankings:
    get:
      tags: [runs]
      operationId: getRankings
      summary: Guild rankings (materialized read model)
      description: Only runs with `completed=true` that are not invalidated count toward rankings.
      parameters:
        - name: board
          in: query
          required: true
          schema: { type: string, enum: [fastest_clear, runs_completed] }
        - { name: dungeon_id, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Ranking page.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageMeta' }
