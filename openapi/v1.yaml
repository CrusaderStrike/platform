openapi: 3.1.0
info:
  title: CrusaderStrike Platform API
  version: 1.0.0-draft
  summary: World of Warcraft Forever only.
  description: |
    Language-agnostic v1 contract (platform#14). Supports **World of Warcraft Forever only**.

    **Tenancy:** guild-scoped endpoints derive `guild_id` from the authenticated session's
    active guild membership. Any guild_id in a request body is ignored. The server runs every
    request in a transaction with `SET LOCAL app.guild_id`, and Postgres RLS enforces isolation.

    **Gear lists** are event-sourced. The op log is the source of truth and the list view is a projection
    updated in the same transaction (platform#13). Ops merge at item level, and losing ops are
    reported as conflicts.

    **CORS:** origins `https://crusaderstrike.com` and `https://www.crusaderstrike.com`. Credentialed requests
    get `Access-Control-Allow-Credentials: true`, with methods `GET, POST, PUT, PATCH, DELETE, OPTIONS` and
    headers `Content-Type, X-CSRF-Token, If-Match, Authorization`. Signup endpoints allow no credentials.

    **CSRF:** `GET /auth/session` returns `csrf_token`, which is bound to the session. Every state-changing
    (non-GET) request authenticated with the `cs_session` cookie must send it as `X-CSRF-Token`, or it gets
    `403` with code `csrf_failed`. Requests with a bearer `uploaderToken` are exempt.

    **Body size:** JSON bodies are capped at 64 KB, except `/uploads` and `/sync` (1 MB) and `/sync/savedvariables` (2 MB).
    Larger bodies get `413`.

    **Rate limits:** every response carries `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`.
    A 429 response includes `Retry-After`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.crusaderstrike.com/api/v1
security:
  - session: []
tags:
  - name: signups
    description: Public waitlist signups with double opt-in.
  - name: auth
    description: Blizzard OAuth, session, profile and character selection (platform#11).
  - name: guilds
    description: Guild profile.
  - name: uploads
    description: Batch addon dungeon-run and PvP uploads (platform#3).
  - name: runs
    description: Addon run uploads and reads.
  - name: gear
    description: Event-sourced gear wishlists (platform#17) and per-character equipped gear (slice 1).
  - name: sync
    description: Addon companion sync (web to addon).
  - name: profile
    description: Signed-in user profile and character roster (platform#11).
paths:
  /signups:
    post:
      tags: [signups]
      operationId: createSignup
      summary: Create signup (always 202)
      description: |
        Returns 202 for new and duplicate emails so callers can't tell which emails exist.
        A filled honeypot field (`website`) also gets a fake 202 and nothing is stored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '202':
          description: Pending confirmation.
          headers: { $ref: '#/components/x-rate-headers' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingStatus' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /signups/confirm:
    post:
      tags: [signups]
      operationId: confirmSignup
      summary: Confirm signup (single-use token, 48h)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: confirmed }
        '400': { $ref: '#/components/responses/ValidationError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/blizzard/login:
    get:
      tags: [auth]
      operationId: blizzardLogin
      summary: Start Blizzard OAuth (platform#11)
      description: |
        Redirects to Battle.net authorize with server-side state and PKCE. Scope `wow.profile`.
        The client secret never reaches the browser.
      security: []
      parameters:
        - name: return_to
          in: query
          description: |
            Relative same-site path only, for example `/signin.html`. It must start with a single `/`. Absolute URLs,
            `//host` and backslashes are rejected with 400. Defaults to `/signin.html`.
          schema: { type: string, pattern: '^/(?![/\\])[^\\]*$', maxLength: 512 }
      responses:
        '302':
          description: Redirect to Battle.net authorize URL.
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/blizzard/callback:
    get:
      tags: [auth]
      operationId: blizzardCallback
      summary: OAuth callback; always redirects back to the site
      description: |
        This endpoint never returns JSON to the browser. It always responds with `302` to
        `https://crusaderstrike.com{return_to}` plus an `auth` query parameter:
        - `auth=ok` when the session is set (`Set-Cookie: cs_session; HttpOnly; Secure; SameSite=Lax`).
        - `auth=cancelled` when Battle.net sent `error=access_denied` (the user cancelled; there is no `code`).
        - `auth=error&reason=<code>` for any other failure. `reason` is one of `invalid_state`,
          `upstream_unavailable` (Battle.net token or profile call failed), `oauth_error` or `internal_error`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, description: 'Set by Battle.net on cancel/failure, e.g. access_denied.', schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirect to the site with `auth=ok|cancelled|error`.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string } }
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session, memberships and active guild
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [auth]
      operationId: logout
      summary: Log out
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/session/active-guild:
    put:
      tags: [auth]
      operationId: setActiveGuild
      summary: Switch active guild (must be a membership of the session)
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guild_id]
              properties:
                guild_id: { type: string, format: uuid }
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/characters:
    get:
      tags: [auth]
      operationId: listMyCharacters
      summary: The signed-in user's WoW Forever characters and main/alt selection
      description: |
        Fetched from the Battle.net profile API using the **WoW Forever** profile namespace
        `profile-forever-{region}` (for example `profile-forever-us`). Characters from any other game version are never
        returned. `surname` and `realm` are optional because the Forever profile may omit them.
      responses:
        '200':
          description: Character list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /me/characters/selection:
    put:
      tags: [auth]
      operationId: setMyCharacterSelection
      summary: Set main and alts (full replace, idempotent)
      description: |
        `main_id` is required and must be one of the user's WoW Forever characters. `alt_ids` must also be the user's
        characters, must not include `main_id`, has no duplicates and may be empty. `Member.is_main` is derived from this selection.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterSelectionInput' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [selection]
                properties:
                  selection: { $ref: '#/components/schemas/CharacterSelection' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }

  /me/profile:
    get:
      tags: [profile]
      operationId: getMyProfile
      summary: Signed-in user profile
      description: |
        Returns the Battle.net profile for the session: battletag, preferred region, the current
        main character id (null until the user picks one via `PUT /me/characters/selection`), and
        timestamps. Character roster details live on `GET /me/characters`.
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [profile]
      operationId: updateMyProfile
      summary: Update profile fields (not character selection)
      description: |
        Partial update of non-character profile fields. Character main/alt selection stays on
        `PUT /me/characters/selection`. Empty body is a no-op that returns the current profile.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileUpdate' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/characters/refresh:
    post:
      tags: [profile]
      operationId: refreshMyCharacters
      summary: Re-pull WoW Forever characters from Battle.net
      description: |
        CSRF-protected. Re-fetches the Battle.net profile with namespace `profile-forever-{region}`
        using the stored user token, upserts Forever characters, and marks missing ones stale
        (never hard-deletes). If the current main goes stale, `selection.main_id` is cleared.
        Returns **200** with the same body as `GET /me/characters`.
        Blizzard failures return **502** `upstream_unavailable`.
        At most one successful or attempted refresh per user per **60 seconds**; a faster call
        returns **429** with `Retry-After` (seconds until the window opens).
        Character main/alt selection remains `PUT /me/characters/selection` (no `/me/main`).
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Refreshed character list (same shape as GET /me/characters).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: |
            Refresh called within the 60-second window. `Retry-After` is seconds until another
            refresh is allowed. Body uses the shared `Error` shape (`rate_limited`).
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /characters/{character_id}/gear:
    get:
      tags: [gear]
      operationId: getCharacterGear
      summary: Equipped gear for a character (owner-only for now)
      description: |
        Per-character **equipped** gear (what the character is wearing), distinct from event-sourced
        gear *wishlists* under `/gear-lists` (platform#17). **Slice 1 / until platform#2 memberships:**
        owner-only. Non-owners (and unknown ids) get **404** so existence is not leaked. Guild-visible
        reads land after #2. Empty slots are omitted. Item objects use **camelCase** `itemId`
        (Web Dev mock contract).
      parameters:
        - name: character_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Equipped gear.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterGear' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [gear]
      operationId: putCharacterGear
      summary: Replace equipped gear (owner-only, CSRF-protected, full replace)
      description: |
        Owner-only. Full replace of the equipped set. At most one item per slot. Unknown slots or
        duplicate slots return 400. Non-owners get **404** (same as GET) until guild visibility in #2;
        widen to 403 for known non-owners after memberships land. Wishlist edits stay on `/gear-lists`.
        Body items use camelCase `itemId`.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: character_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterGearInput' }
      responses:
        '200':
          description: Saved equipped gear.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterGear' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /guild:
    get:
      tags: [guilds]
      operationId: getGuild
      summary: Active guild profile
      responses:
        '200':
          description: Guild.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guild' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [guilds]
      operationId: updateGuild
      summary: Update guild profile (officer+; optimistic lock)
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: If-Match
          in: header
          required: true
          description: ETag (version) from GET.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuildUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guild' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /guilds:
    post:
      tags: [guilds]
      operationId: createGuild
      summary: Create guild (caller becomes owner)
      description: Exposes the open question from data-model.md (guild creation is currently admin-only).
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuildCreate' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guild' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /guild/members:
    get:
      tags: [guilds]
      operationId: listMembers
      summary: Guild roster
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of members.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageMeta' }
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Member' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /uploads:
    post:
      tags: [uploads]
      operationId: uploadAddonData
      security: [{ session: [] }]
      summary: Batch-upload dungeon runs and PvP records from the addon
      description: |
        Authenticated session upload for CrusaderStrike/addon export data (docs/run-schema.md,
        docs/pvp-schema.md from addon#15). `characterId` must be the caller's selected main or alt.
        Records are idempotent on `(guild_id, character_id, addon_run_id|addon_pvp_id)`.
        Unknown `schemaVersion` → 400. Strict JSON (`additionalProperties: false`). Max body 1 MB.
        Battleground `stats` stores `honorable_kills` only (no killing-blows metric).
        Response counts `accepted`, `duplicate`, and `rejected` (with reasons).
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddonUpload' }
      responses:
        '200':
          description: Ingest summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddonUploadResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /runs:
    post:
      tags: [runs]
      operationId: uploadRun
      security: [{ session: [] }, { uploaderToken: [] }]
      summary: Upload a run as the addon's JSON payload (schemaVersion 1)
      description: |
        The body is exactly the addon's run JSON (CrusaderStrike/addon `docs/run-schema.md`, camelCase).
        The server stores the full JSON as `raw_payload`, and the `Run` response uses snake_case stored fields.
        **Idempotency and upgrade rules** on `(guild_id, addon_run_id)`, where `addon_run_id = addonRunId`:
        - No stored run: insert and return **201**.
        - Stored run has `completed=false` and the new payload is a superset (same `instance.id` and `startedAt`,
          with `bosses`/`deaths` containing the stored ones, and `endedAt`/`completed` only moving forward):
          replace it, keep the `run_id`, store the new `raw_payload`, and return **200** with `updated: true`.
        - The payload equals the stored one, or is a subset of it (an older export of the same run): return **200** with `updated: false`.
        - Stored run has `completed=true` and the payload differs: return **409** `run_immutable`. Completed runs change
          only through `POST /runs/{run_id}/corrections`.
        - Stored run is unfinished but the payload is not a superset (for example a different `instance.id` or `startedAt`):
          return **409** `run_payload_mismatch`.

        Validation: `schemaVersion` above the server maximum (currently 1) returns **400** with
        `errors.schemaVersion = "unsupported"`. `gameVersion` must be `forever`. Max body 64 KB (413).
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunUpload' }
      responses:
        '201':
          description: New run created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '200':
          description: |
            Existing run. `updated: true` means an unfinished run was upgraded. `updated: false` means an identical
            or older retry, and the stored run is returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [runs]
      operationId: listRuns
      summary: Run history (newest first)
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: dungeon_id, in: query, description: instanceMapID, schema: { type: integer } }
        - { name: character, in: query, schema: { type: string } }
        - { name: completed, in: query, schema: { type: boolean } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Page of runs.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageMeta' }
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Run' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /runs/import:
    post:
      tags: [runs]
      operationId: importRunExport
      security: [{ session: [] }, { uploaderToken: [] }]
      summary: Import the addon's `CSRUN1:` export string (website paste box / companion)
      description: |
        The server decodes the string: it strips all whitespace, requires the `CSRUN1:` prefix, base64-decodes the rest
        to UTF-8, parses it as JSON and validates it against `RunUpload`. It then ingests it exactly like `POST /runs`.
        A bad prefix, bad base64 or bad JSON returns **400** with `errors.export` set to `bad_prefix`, `bad_base64` or `bad_json`.
        The body can be JSON `{"export": "..."}` or the raw string as `text/plain`.
        **Idempotency and upgrade rules** on `(guild_id, addon_run_id)`, where `addon_run_id = addonRunId`:
        - No stored run: insert and return **201**.
        - Stored run has `completed=false` and the new payload is a superset (same `instance.id` and `startedAt`,
          with `bosses`/`deaths` containing the stored ones, and `endedAt`/`completed` only moving forward):
          replace it, keep the `run_id`, store the new `raw_payload`, and return **200** with `updated: true`.
        - The payload equals the stored one, or is a subset of it (an older export of the same run): return **200** with `updated: false`.
        - Stored run has `completed=true` and the payload differs: return **409** `run_immutable`. Completed runs change
          only through `POST /runs/{run_id}/corrections`.
        - Stored run is unfinished but the payload is not a superset (for example a different `instance.id` or `startedAt`):
          return **409** `run_payload_mismatch`.

        Validation: `schemaVersion` above the server maximum (currently 1) returns **400** with
        `errors.schemaVersion = "unsupported"`. `gameVersion` must be `forever`. Max body 64 KB (413).
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunImport' }
          text/plain:
            schema: { type: string, pattern: '^\\s*CSRUN1:', maxLength: 65536 }
      responses:
        '201':
          description: New run created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '200':
          description: |
            Existing run. `updated: true` means an unfinished run was upgraded. `updated: false` means an identical
            or older retry, and the stored run is returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /runs/{run_id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: One run with participants and corrections
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: Run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{run_id}/corrections:
    post:
      tags: [runs]
      operationId: correctRun
      summary: Append a correction or invalidation (officer+; who may correct is an open question for Drew)
      description: This is the only way to change a completed run. The original `raw_payload` is kept.
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunCorrection' }
      responses:
        '201':
          description: Correction appended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rankings:
    get:
      tags: [runs]
      operationId: getRankings
      summary: Guild rankings (materialized read model)
      description: Only runs with `completed=true` that are not invalidated count toward rankings.
      parameters:
        - name: board
          in: query
          required: true
          schema: { type: string, enum: [fastest_clear, runs_completed] }
        - { name: dungeon_id, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Ranking page.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageMeta' }
                  - type: object
                    properties:
                      refreshed_at: { type: string, format: date-time }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RankingEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /gear-lists:
    get:
      tags: [gear]
      operationId: listGearLists
      summary: Gear lists in the active guild
      parameters:
        - { name: member_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of gear lists.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageMeta' }
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/GearList' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [gear]
      operationId: createGearList
      summary: Create gear list (emits GearListCreated)
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_id, name]
              properties:
                member_id: { type: string, format: uuid }
                name: { type: string, maxLength: 64 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GearList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /gear-lists/{list_id}:
    get:
      tags: [gear]
      operationId: getGearList
      summary: Gear list projection
      parameters: [{ $ref: '#/components/parameters/ListId' }]
      responses:
        '200':
          description: Gear list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GearList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gear-lists/{list_id}/ops:
    post:
      tags: [gear]
      operationId: applyGearOps
      summary: Append gear ops (idempotent per op_id; item-level merge)
      description: |
        Ops are applied in order. Ops with an `op_id` that was already seen are acknowledged as `duplicate`.
        Ops on different items always merge. If the same item was changed after `base_version`,
        last-writer-wins by server time, deletes beat reprioritizes, and a stale addon op loses to a web op.
        Losing ops are recorded as `GearOpRejected` and returned in `conflicts`.
        Returns 200 even when some ops conflict.
      parameters:
        - { $ref: '#/components/parameters/ListId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/GearOp' }
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GearOpsResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /gear-lists/{list_id}/events:
    get:
      tags: [gear]
      operationId: listGearEvents
      summary: Gear list event history
      description: Visibility (all members vs officers only) is an open question for Drew (#13 Q2); 403 if restricted.
      parameters:
        - { $ref: '#/components/parameters/ListId' }
        - name: after_version
          in: query
          schema: { type: integer, minimum: 0 }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Events ascending by version.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageMeta' }
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/GearEvent' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sync/savedvariables:
    post:
      tags: [sync]
      operationId: manualSavedVariablesSync
      summary: Manual sync without a helper app (upload SavedVariables, download updated file)
      description: |
        This is the default path from the #13 joint recommendation, and it needs no desktop app. A signed-in user uploads
        `WTF/Account/<ACCOUNT>/SavedVariables/CrusaderStrike.lua` from the website. The server parses the pending
        runs and gear ops from it and applies them with the same rules as `/sync`
        (idempotent per addon_run_id and op_id, with item-level merge and conflicts). It then returns an updated file
        for the user to save back and `/reload` or relog in game. The guild comes from the session.
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: text/plain, description: 'SavedVariables Lua file, max 2 MB.' }
      responses:
        '200':
          description: Updated SavedVariables file; summary in X-CS-Sync-Summary (JSON-encoded SyncResponse counts).
          headers:
            Content-Disposition: { schema: { type: string } }
            X-CS-Sync-Summary: { schema: { type: string } }
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /sync:
    post:
      tags: [sync]
      operationId: addonSync
      security: [{ uploaderToken: [] }, { session: [] }]
      summary: Companion uploader sync (push runs and gear ops, pull changes)
      description: |
        Optional helper-app path. Whether members may install a desktop app is an open question for Drew (#13 Q1).
        The default is `/sync/savedvariables`.
        Each run is processed independently. A run that fails validation or conflicts is reported in its own
        `SyncResponse.runs[]` entry and does not fail the batch. Max body 1 MB (413).
        Used for pull at game launch, push at game exit and a manual "Sync now".
        This one call combines the run upload semantics (idempotent per addon_run_id) and gear ops,
        then returns server events after each list's `since_version` for the companion to write into SavedVariables.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncRequest' }
      responses:
        '200':
          description: Sync result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: cs_session
      description: Session cookie set after Blizzard OAuth (platform#11). The companion uploader uses `uploaderToken`.
    uploaderToken:
      type: http
      scheme: bearer
      description: Per-user uploader token (placeholder, issued after OAuth).
  x-rate-headers:
    RateLimit-Limit: { schema: { type: integer } }
    RateLimit-Remaining: { schema: { type: integer } }
    RateLimit-Reset: { schema: { type: integer } }
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required on non-GET requests that use the `cs_session` cookie. Must equal `Session.csrf_token`. Not needed with a bearer `uploaderToken`. Mismatch returns 403 `csrf_failed`.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ListId:
      name: list_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    RetryAfter:
      description: Seconds until retry is allowed.
      schema: { type: integer }
  responses:
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrors' }
    UnsupportedMediaType:
      description: Body must be application/json.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected server error (code `internal_error`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Body exceeds the size limit for this endpoint.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamUnavailable:
      description: Battle.net API failed or timed out (code `upstream_unavailable`); retry later.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No or invalid session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed for this role or guild, or `csrf_failed`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found in the active guild (RLS hides other guilds).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict (e.g. `run_immutable`, `run_payload_mismatch`, `slug_taken`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: Version mismatch; reload and retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [unauthenticated, csrf_failed, rate_limited, not_found, version_mismatch, run_immutable, run_payload_mismatch, payload_too_large, upstream_unavailable, internal_error]
            message: { type: string }
            request_id: { type: string }
    ValidationErrors:
      type: object
      description: Matches the signup contract.
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties: { type: string }
    PendingStatus:
      type: object
      required: [status]
      properties:
        status: { const: pending }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    SignupRequest:
      type: object
      required: [email, consent, consent_version]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        character_name: { type: string, maxLength: 48 }
        realm: { type: string, maxLength: 48 }
        faction: { type: string, enum: [alliance, horde] }
        guild_name: { type: string, maxLength: 48 }
        interests:
          type: array
          items: { type: string, enum: [guild_site, dungeon_run, world_pvp, addon] }
        consent: { const: true }
        consent_version: { type: string }
        website: { type: string, maxLength: 0, description: Honeypot; must be empty. }
    PageMeta:
      type: object
      required: [next_cursor]
      properties:
        next_cursor: { type: [string, 'null'] }
    Session:
      type: object
      required: [battletag, memberships, csrf_token]
      properties:
        battletag: { type: string }
        csrf_token: { type: string, description: Send as X-CSRF-Token on state-changing cookie requests. }
        active_guild_id: { type: [string, 'null'], format: uuid }
        memberships:
          type: array
          items:
            type: object
            properties:
              guild_id: { type: string, format: uuid }
              guild_name: { type: string }
              role: { $ref: '#/components/schemas/MemberRole' }
    MemberRole:
      type: string
      enum: [owner, officer, member, recruit, alumni]
    Faction:
      type: string
      enum: [alliance, horde]
    GuildCreate:
      type: object
      required: [name, realm, region]
      properties:
        name: { type: string, maxLength: 48 }
        realm: { type: string, maxLength: 48 }
        region: { $ref: '#/components/schemas/Region' }
        faction: { $ref: '#/components/schemas/Faction' }
    GuildUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 48 }
        description: { type: string, maxLength: 2000 }
        recruiting: { type: boolean }
    Guild:
      type: object
      required: [id, slug, name, realm, region, version]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        realm: { type: string }
        region: { type: string }
        faction: { $ref: '#/components/schemas/Faction' }
        description: { type: string }
        recruiting: { type: boolean }
        game: { const: wow_forever, description: WoW Forever only. }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
    Member:
      type: object
      required: [id, character_name, realm, role]
      properties:
        id: { type: string, format: uuid }
        character_name: { type: string }
        realm: { type: string }
        class: { type: string }
        role: { $ref: '#/components/schemas/MemberRole' }
        is_main: { type: boolean }
    WowClass:
      type: string
      description: Uppercase class token as the addon emits it.
      enum: [WARRIOR, PALADIN, HUNTER, ROGUE, PRIEST, SHAMAN, MAGE, WARLOCK, DRUID]
    AddonRunId:
      type: string
      maxLength: 128
      pattern: '^[^|]+\\|[^|]+\\|[0-9]+\\|[0-9]+$'
      description: '`{realm}|{character}|{startTimeUnix}|{instanceMapID}`, e.g. `CrusaderStrike|Snipy|1730000000|36`.'
    PartyMember:
      type: object
      required: [name, class]
      properties:
        name: { type: string, maxLength: 48 }
        realm: { type: string, maxLength: 48 }
        class: { $ref: '#/components/schemas/WowClass' }
        level: { type: integer, minimum: 1 }
        isPlayer: { type: boolean, description: True for the logging character. }
    BossKill:
      type: object
      required: [npcId, name, killedAt]
      properties:
        npcId: { type: integer }
        name: { type: string, maxLength: 64 }
        killedAt: { type: integer, description: Unix seconds. }
    Death:
      type: object
      required: [name, time]
      properties:
        name: { type: string, maxLength: 48 }
        realm: { type: string, maxLength: 48 }
        time: { type: integer, description: Unix seconds. }
        source: { type: [string, 'null'], maxLength: 64 }

    AddonUpload:
      type: object
      additionalProperties: false
      required: [schemaVersion, characterId]
      description: |
        Batch envelope (schemaVersion 1). At least one of dungeonRuns, worldPvp, battlegrounds
        must be non-empty. Caps match the addon: worldPvp ≤ 1000, battlegrounds ≤ 500, dungeonRuns ≤ 100.
      properties:
        schemaVersion: { type: integer, const: 1 }
        characterId: { type: string, maxLength: 128, description: Platform opaque character id from selection. }
        dungeonRuns:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/RunUploadStrict' }
        worldPvp:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/WorldPvpRecord' }
        battlegrounds:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/BattlegroundRecord' }
    RunUploadStrict:
      allOf:
        - { $ref: '#/components/schemas/RunUpload' }
      description: Same as RunUpload but additionalProperties false for /uploads.
      additionalProperties: false
    WorldPvpRecord:
      type: object
      additionalProperties: false
      required: [v, addon_pvp_id, time, result, honorable]
      description: World PvP kill/death from addon#15 (pvp.world[]).
      properties:
        v: { type: integer, const: 1 }
        addon_pvp_id: { type: string, maxLength: 200 }
        time: { type: integer, description: Unix seconds (UTC). }
        zone: { type: [string, 'null'], maxLength: 64 }
        subzone: { type: [string, 'null'], maxLength: 64 }
        result: { type: string, enum: [kill, death] }
        honorable: { type: boolean }
        killer_source: { type: [string, 'null'], enum: [target, combat_log, null] }
        opponent:
          type: [object, 'null']
          additionalProperties: false
          properties:
            name: { type: [string, 'null'], maxLength: 48 }
            realm: { type: [string, 'null'], maxLength: 48 }
            class: { type: [string, 'null'], maxLength: 32 }
            level: { type: [integer, 'null'] }
            faction: { type: [string, 'null'], enum: [alliance, horde, null], description: Lowercase. }
    BattlegroundRecord:
      type: object
      additionalProperties: false
      required: [v, addon_pvp_id, mapId, mapName, startedAt, endedAt, durationSec, result]
      description: Battleground match from addon#15 (pvp.battlegrounds[]). Stats store honorable_kills only.
      properties:
        v: { type: integer, const: 1 }
        addon_pvp_id: { type: string, maxLength: 200 }
        mapId: { type: integer }
        mapName: { type: string, maxLength: 64 }
        faction: { type: [string, 'null'], enum: [alliance, horde, null] }
        startedAt: { type: integer, description: Unix seconds (UTC). }
        endedAt: { type: integer, description: Unix seconds (UTC). }
        durationSec: { type: integer, minimum: 0 }
        result: { type: string, enum: [win, loss, left, draw] }
        winner: { type: [integer, 'null'], enum: [0, 1, 255, null] }
        stats:
          type: object
          additionalProperties: false
          properties:
            honorableKills: { type: integer, minimum: 0 }
            deaths: { type: integer, minimum: 0 }
            honor: { type: integer, minimum: 0 }
    AddonUploadResult:
      type: object
      required: [accepted, duplicate, rejected, guild_id, character_id]
      properties:
        accepted: { type: integer }
        duplicate: { type: integer }
        rejected:
          type: array
          items:
            type: object
            required: [kind, id, reason]
            properties:
              kind: { type: string, enum: [dungeon_run, world_pvp, battleground] }
              id: { type: string }
              reason: { type: string }
        guild_id: { type: string, format: uuid }
        character_id: { type: string }
    RunUpload:
      type: object
      description: |
        The addon run JSON, schemaVersion 1, exactly as emitted (keys are camelCase and sorted by the addon encoder).
        Server mapping: addonRunId to addon_run_id, instance.id to dungeon_id, instance.name to dungeon,
        instance.difficultyName to difficulty, startedAt/endedAt (unix seconds) to started_at/completed_at,
        durationSec*1000 to duration_ms, completed to completed, party[] to participants, and the full JSON to raw_payload.
        Unknown extra keys are accepted and kept in raw_payload.
      required: [schemaVersion, gameVersion, idempotencyKey, addonRunId, realm, character, instance, startedAt, completed, status, party, bosses, deaths]
      properties:
        schemaVersion: { type: integer, minimum: 1, description: 'Server max is 1; above that returns 400.' }
        gameVersion: { const: forever }
        idempotencyKey: { $ref: '#/components/schemas/AddonRunId' }
        addonRunId: { $ref: '#/components/schemas/AddonRunId' }
        realm: { type: string, maxLength: 48 }
        character: { type: string, maxLength: 48 }
        instance:
          type: object
          required: [id, name]
          properties:
            id: { type: integer, description: instanceMapID }
            name: { type: string, maxLength: 64 }
            difficulty: { type: [integer, 'null'] }
            difficultyName: { type: [string, 'null'] }
        startedAt: { type: integer, description: Unix seconds. }
        endedAt: { type: [integer, 'null'] }
        durationSec: { type: [integer, 'null'], minimum: 0 }
        completed: { type: boolean, description: Final boss killed. }
        status: { type: string, enum: [in_progress, closed, completed] }
        party: { type: array, minItems: 1, maxItems: 40, items: { $ref: '#/components/schemas/PartyMember' } }
        bosses: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/BossKill' } }
        deaths: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/Death' } }
    RunImport:
      type: object
      required: [export]
      properties:
        export: { type: string, maxLength: 65536, description: '`CSRUN1:<base64(utf8 json)>`.' }
    RunCorrection:
      type: object
      required: [kind, reason]
      properties:
        kind: { type: string, enum: [correct, invalidate] }
        reason: { type: string, maxLength: 500 }
        changes:
          type: object
          properties:
            duration_ms: { type: integer }
            completed_at: { type: string, format: date-time }
            completed: { type: boolean }
    Participant:
      type: object
      required: [character_name, class]
      properties:
        character_name: { type: string }
        realm: { type: [string, 'null'] }
        class: { $ref: '#/components/schemas/WowClass' }
        level: { type: [integer, 'null'] }
        is_logger: { type: boolean }
        role: { type: [string, 'null'], enum: [tank, healer, dps, null], description: Not supplied by the addon; optional. }
        member_id: { type: [string, 'null'], format: uuid }
    Run:
      type: object
      description: Stored run (snake_case), stored with RLS on guild_id.
      required: [id, addon_run_id, schema_version, game_version, dungeon_id, dungeon, started_at, completed, participants, bosses, deaths]
      properties:
        id: { type: string, format: uuid }
        addon_run_id: { $ref: '#/components/schemas/AddonRunId' }
        schema_version: { type: integer }
        game_version: { const: forever }
        dungeon_id: { type: integer }
        dungeon: { type: string }
        difficulty: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        duration_ms: { type: [integer, 'null'] }
        completed: { type: boolean }
        status: { type: string, enum: [in_progress, closed, completed] }
        participants: { type: array, items: { $ref: '#/components/schemas/Participant' } }
        bosses: { type: array, items: { $ref: '#/components/schemas/BossKill' } }
        deaths: { type: array, items: { $ref: '#/components/schemas/Death' } }
        raw_payload: { type: object, description: Latest accepted addon JSON verbatim. }
        invalidated: { type: boolean }
        updated: { type: boolean, description: True when this request upgraded an unfinished run. }
        uploaded_by: { type: string }
        recorded_at: { type: string, format: date-time }
        corrections: { type: array, items: { $ref: '#/components/schemas/RunCorrection' } }
    Region:
      type: string
      enum: [us, eu, kr, tw]
    Character:
      type: object
      description: WoW Forever character from Battle.net profile namespace `profile-forever-{region}`.
      required: [id, character_name, game]
      properties:
        id: { type: string, description: Stable opaque id. }
        character_name: { type: string }
        surname: { type: [string, 'null'] }
        realm: { type: [string, 'null'] }
        region: { $ref: '#/components/schemas/Region' }
        faction: { type: [string, 'null'], enum: [alliance, horde, null], description: 'Optional. Lowercase API values; Blizzard ALLIANCE/HORDE map here. Null when unknown.' }
        class: { type: string }
        race: { type: string }
        level: { type: integer }
        game: { const: wow_forever }
        stale:
          type: boolean
          description: True when the character was missing from the latest Battle.net refresh. Never hard-deleted.
    CharacterSelectionInput:
      type: object
      required: [main_id, alt_ids]
      properties:
        main_id: { type: string }
        alt_ids: { type: array, uniqueItems: true, maxItems: 50, items: { type: string } }
    CharacterSelection:
      allOf:
        - { $ref: '#/components/schemas/CharacterSelectionInput' }
        - type: object
          required: [updated_at]
          properties:
            updated_at: { type: string, format: date-time }
    CharacterList:
      type: object
      required: [game, characters, selection]
      properties:
        game: { const: wow_forever }
        characters: { type: array, items: { $ref: '#/components/schemas/Character' } }
        selection:
          oneOf:
            - { $ref: '#/components/schemas/CharacterSelection' }
            - { type: 'null' }

    UserProfile:
      type: object
      required: [battletag, main_character_id, preferred_region, created_at, updated_at]
      properties:
        battletag: { type: string }
        main_character_id:
          type: [string, 'null']
          description: Same as CharacterSelection.main_id; null until the user picks a main.
        preferred_region: { $ref: '#/components/schemas/Region' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserProfileUpdate:
      type: object
      minProperties: 0
      additionalProperties: false
      properties:
        preferred_region: { $ref: '#/components/schemas/Region' }
    EquippedItem:
      type: object
      description: |
        One equipped item on a character. Uses camelCase `itemId` to match the Web Dev mock;
        wishlist `GearItem` keeps snake_case `item_id` (platform#17).
      required: [slot, itemId]
      properties:
        slot: { $ref: '#/components/schemas/GearSlot' }
        itemId: { type: integer, minimum: 1 }
        name: { type: [string, 'null'], maxLength: 128 }
        quality:
          type: [string, 'null']
          enum: [poor, common, uncommon, rare, epic, legendary, null]
        ilvl: { type: [integer, 'null'], minimum: 1 }
        icon: { type: [string, 'null'], maxLength: 128, description: "Blizzard icon asset name without file extension (compat)." }
        icon_url:
          type: [string, 'null']
          format: uri
          description: |
            Full HTTPS URL from Blizzard Item Media when Forever static namespace is officially
            documented. Currently always null: Blizzard has not published an official Forever
            static namespace pairing with `profile-forever-{region}` (community probes suggest
            `static-forever-{region}`, unconfirmed — do not guess). When enabled, platform will
            call `GET /data/wow/media/item/{itemId}` and cache `assets[key=icon].value`, accepting
            only `https` URLs whose host is exactly `render.worldofwarcraft.com`. Clients must not
            build `render.worldofwarcraft.com` URLs themselves. Classic namespaces are never used.
    CharacterGearInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 19
          items: { $ref: '#/components/schemas/EquippedItem' }
    CharacterGear:
      allOf:
        - { $ref: '#/components/schemas/CharacterGearInput' }
        - type: object
          required: [character_id, updated_at]
          properties:
            character_id: { type: string }
            updated_at: { type: string, format: date-time }

    RankingEntry:
      type: object
      properties:
        rank: { type: integer }
        character_name: { type: string }
        member_id: { type: [string, 'null'], format: uuid }
        value: { type: number }
        run_id: { type: [string, 'null'], format: uuid }
    GearSlot:
      type: string
      description: WoW Forever equipment slots (shared by web and addon).
      enum: [head, neck, shoulder, back, chest, shirt, tabard, wrist, hands, waist, legs, feet, finger1, finger2, trinket1, trinket2, main_hand, off_hand, ranged]
    GearItem:
      type: object
      required: [slot, item_id, priority]
      properties:
        slot: { $ref: '#/components/schemas/GearSlot' }
        item_id: { type: integer }
        priority: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 200 }
        obtained: { type: boolean }
    GearList:
      type: object
      required: [id, member_id, name, version, items]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, description: Last applied event sequence. }
        items: { type: array, items: { $ref: '#/components/schemas/GearItem' } }
        updated_at: { type: string, format: date-time }
    GearOp:
      type: object
      required: [op_id, type, slot, item_id, base_version]
      properties:
        op_id: { type: string, format: uuid, description: 'Idempotency key (guild_id, op:op_id).' }
        type: { type: string, enum: [add_item, remove_item, reprioritize_item, mark_obtained] }
        slot: { $ref: '#/components/schemas/GearSlot' }
        item_id: { type: integer }
        priority: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 200 }
        run_id: { type: [string, 'null'], format: uuid }
        base_version: { type: integer, minimum: 0 }
        client_ts: { type: string, format: date-time }
        source: { type: string, enum: [web, addon] }
    GearEvent:
      type: object
      required: [version, event_type, recorded_at]
      properties:
        version: { type: integer }
        event_type:
          type: string
          enum: [GearListCreated, GearItemAdded, GearItemRemoved, GearItemReprioritized, GearItemObtained, GearOpRejected]
        payload: { type: object }
        actor: { type: string }
        source: { type: string, enum: [web, addon, system] }
        op_id: { type: [string, 'null'], format: uuid }
        recorded_at: { type: string, format: date-time }
    GearConflict:
      type: object
      required: [op_id, reason]
      properties:
        op_id: { type: string, format: uuid }
        reason: { type: string, enum: [superseded_by_newer_edit, item_removed, stale_base_version] }
        winning_version: { type: integer }
        message: { type: string }
    GearOpsResult:
      type: object
      required: [version, applied, duplicates, conflicts]
      properties:
        version: { type: integer }
        applied: { type: array, items: { type: string, format: uuid } }
        duplicates: { type: array, items: { type: string, format: uuid } }
        conflicts: { type: array, items: { $ref: '#/components/schemas/GearConflict' } }
        list: { $ref: '#/components/schemas/GearList' }
    SyncRequest:
      type: object
      properties:
        runs:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/RunUpload' }
        gear:
          type: array
          maxItems: 50
          items:
            type: object
            required: [list_id, since_version]
            properties:
              list_id: { type: string, format: uuid }
              since_version: { type: integer, minimum: 0 }
              ops: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/GearOp' } }
    SyncResponse:
      type: object
      required: [runs, gear]
      properties:
        runs:
          type: array
          items:
            type: object
            required: [addon_run_id, status]
            properties:
              addon_run_id: { type: string }
              status: { type: string, enum: [created, updated, unchanged, error] }
              run_id: { type: [string, 'null'], format: uuid }
              created: { type: boolean }
              error: { oneOf: [{ $ref: '#/components/schemas/Error' }, { $ref: '#/components/schemas/ValidationErrors' }, { type: 'null' }] }
        gear:
          type: array
          items:
            type: object
            properties:
              list_id: { type: string, format: uuid }
              result: { $ref: '#/components/schemas/GearOpsResult' }
              events: { type: array, items: { $ref: '#/components/schemas/GearEvent' } }
